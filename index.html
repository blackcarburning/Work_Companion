    // ===== SELECTION HELPERS =====
    var _savedRange = null;

    function saveEditorSelection() {
      var sel = window.getSelection();
      if (sel && sel.rangeCount > 0) _savedRange = sel.getRangeAt(0).cloneRange();
    }

    function restoreEditorSelection() {
      var ed = document.getElementById("summary-editor");
      if (!ed) return;
      ed.focus();
      if (!_savedRange) return;
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(_savedRange);
    }

    // ===== PER-SELECTION FORMATTING =====
    function applyFontFamily(value) {
      restoreEditorSelection();
      document.execCommand("fontName", false, value);
      var ed = document.getElementById("summary-editor");
      if (ed) { db.summary = ed.innerHTML; saveDB(); }
    }

    function applyFontSize(value) {
      restoreEditorSelection();
      document.execCommand("fontSize", false, value);
      var ed = document.getElementById("summary-editor");
      if (ed) { db.summary = ed.innerHTML; saveDB(); }
    }

    function applyTextColor(value) {
      restoreEditorSelection();
      document.execCommand("foreColor", false, value);
      var ed = document.getElementById("summary-editor");
      if (ed) { db.summary = ed.innerHTML; saveDB(); }
    }

    function applyBgColor(value) {
      restoreEditorSelection();
      // 'hiliteColor' is the standard; 'backColor' is a Firefox fallback
      if (!document.execCommand("hiliteColor", false, value)) {
        document.execCommand("backColor", false, value);
      }
      var ed = document.getElementById("summary-editor");
      if (ed) { db.summary = ed.innerHTML; saveDB(); }
    }

    // ===== PDF EXPORT =====
    function stripHtmlToText(html) {
      var tmp = document.createElement("div");
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || "";
    }

    function stripMarkdown(text) {
      if (!text) return "";
      return text
        .replace(/```[\w]*\n?([\s\S]*?)```/g, "$1")
        .replace(/`([^`]+)`/g, "$1")
        .replace(/\*\*([^*]+)\*\*/g, "$1")
        .replace(/\*([^*]+)\*/g, "$1")
        .replace(/#{1,6}\s+/g, "")
        .replace(/<a[^>]*href="([^"]*)"[^>]*>([^<]*)<\/a>/gi, "$2 ($1)")
        .replace(/<[^>]+>/g, "");
    }

    function getActivePdfTheme() {
      if ((db.pdfTheme === "custom" || db.pdfTheme === "word-import") && db.customPdfTheme) return db.customPdfTheme;
      return PDF_THEMES[db.pdfTheme] || PDF_THEMES["professional"];
    }

    async function exportToPDF(btn) {
      if (!window.jspdf) {
        alert("PDF library is still loading. Please try again in a moment.");
        return;
      }
      if (btn) { btn.textContent = "⏳ Generating…"; btn.disabled = true; }
      try {
        saveCurrentNotes();
        var se = document.getElementById("summary-editor");
        if (se) db.summary = se.innerHTML;

        var theme = getActivePdfTheme();

        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        var totalPagesAlias = "{total_pages_count_string}";

        var pageW = pdf.internal.pageSize.getWidth();
        var pageH = pdf.internal.pageSize.getHeight();
        var marginL = theme.spacing.marginLeft;
        var marginT = theme.spacing.marginTop;
        var marginB = theme.spacing.marginBottom;
        var contentW = pageW - marginL - theme.spacing.marginRight;
        var y = marginT;

        // Line height in mm from font size in pt
        function lh(fs) { return fs * 0.45; }

        function hexToRgbLocal(hex) {
          hex = (hex || "#888888").replace("#", "");
          if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
          if (hex.length !== 6) return [136, 136, 136];
          return [parseInt(hex.slice(0,2),16), parseInt(hex.slice(2,4),16), parseInt(hex.slice(4,6),16)];
        }

        function newPage() { pdf.addPage(); y = marginT; }

        function checkBreak(needed) {
          if (y + needed > pageH - marginB) { newPage(); }
        }

        function setStyle(fs, style, r, g, b) {
          pdf.setFontSize(fs);
          pdf.setFont(theme.fonts.body, style || "normal");
          if (r !== undefined) { pdf.setTextColor(r, g, b); } else { pdf.setTextColor(...theme.colors.body); }
        }

        function writeWrapped(text, fs, style, indent, r, g, b) {
          if (!text) return;
          setStyle(fs, style, r, g, b);
          var x = marginL + (indent || 0);
          var w = contentW - (indent || 0);
          var lines = pdf.splitTextToSize(text, w);
          var lineH = lh(fs);
          for (var i = 0; i < lines.length; i++) {
            checkBreak(lineH);
            pdf.text(lines[i], x, y);
            y += lineH;
          }
          if (r !== undefined) { pdf.setTextColor(...theme.colors.body); }
        }

        function hRule(thickness, colorArr) {
          checkBreak(3);
          pdf.setLineWidth(thickness || 0.3);
          var c = colorArr || theme.colors.sectionDivider;
          pdf.setDrawColor(c[0], c[1], c[2]);
          pdf.line(marginL, y, pageW - theme.spacing.marginRight, y);
          pdf.setDrawColor(0, 0, 0);
          y += 2;
        }

        // ===== MARKDOWN / CARD RENDERING HELPERS =====

        function pdfRenderCodeBlock(codeLines, startX, startY, maxW) {
          var code = codeLines.join('\n');
          var padding = 3;
          pdf.setFont("courier", "normal");
          pdf.setFontSize(8.5);
          var wrappedLines = pdf.splitTextToSize(code, maxW - padding * 2);
          var lineH = 3.5;
          var blockH = wrappedLines.length * lineH + padding * 2;
          if (startY + blockH > pageH - marginB) { pdf.addPage(); startY = marginT; }
          pdf.setFillColor(22, 27, 34);
          pdf.rect(startX, startY, maxW, blockH, 'F');
          pdf.setTextColor(230, 237, 243);
          pdf.text(wrappedLines, startX + padding, startY + padding + lineH);
          pdf.setTextColor(theme.colors.body[0], theme.colors.body[1], theme.colors.body[2]);
          pdf.setFont(theme.fonts.body, "normal");
          pdf.setFontSize(theme.sizes.body);
          return startY + blockH + 3;
        }

        function pdfRenderHeading(text, level, startX, startY, maxW) {
          var fs = level === 1 ? theme.sizes.h1 : (level === 2 ? theme.sizes.h2 : theme.sizes.h3);
          var lineHv = lh(fs) + 1;
          if (startY + lineHv + 4 > pageH - marginB) { pdf.addPage(); startY = marginT; }
          pdf.setFont(theme.fonts.heading, "bold");
          pdf.setFontSize(fs);
          pdf.setTextColor(theme.colors.heading[0], theme.colors.heading[1], theme.colors.heading[2]);
          var textLines = pdf.splitTextToSize(text, maxW);
          for (var ti = 0; ti < textLines.length; ti++) {
            pdf.text(textLines[ti], startX, startY);
            startY += lineHv;
          }
          if (level <= 2) {
            pdf.setDrawColor(theme.colors.sectionDivider[0], theme.colors.sectionDivider[1], theme.colors.sectionDivider[2]);
            pdf.setLineWidth(0.2);
            pdf.line(startX, startY, startX + maxW, startY);
            pdf.setDrawColor(0, 0, 0);
            startY += 2;
          }
          pdf.setFont(theme.fonts.body, "normal");
          pdf.setFontSize(theme.sizes.body);
          pdf.setTextColor(theme.colors.body[0], theme.colors.body[1], theme.colors.body[2]);
          return startY + 1;
        }

        function pdfRenderBullet(text, startX, startY, maxW) {
          var lineHv = lh(theme.sizes.body);
          var indent = 5;
          if (startY + lineHv > pageH - marginB) { pdf.addPage(); startY = marginT; }
          pdf.setFont(theme.fonts.body, "normal");
          pdf.setFontSize(theme.sizes.body);
          pdf.setTextColor(theme.colors.body[0], theme.colors.body[1], theme.colors.body[2]);
          pdf.text("\u2022", startX + indent - 3, startY);
          var textLines = pdf.splitTextToSize(text, maxW - indent - 2);
          for (var ti = 0; ti < textLines.length; ti++) {
            if (startY > pageH - marginB) { pdf.addPage(); startY = marginT; }
            pdf.text(textLines[ti], startX + indent, startY);
            startY += lineHv;
          }
          return startY;
        }

        function pdfRenderNumberedItem(text, startX, startY, maxW) {
          var lineHv = lh(theme.sizes.body);
          var indent = 7;
          if (startY + lineHv > pageH - marginB) { pdf.addPage(); startY = marginT; }
          pdf.setFont(theme.fonts.body, "normal");
          pdf.setFontSize(theme.sizes.body);
          pdf.setTextColor(theme.colors.body[0], theme.colors.body[1], theme.colors.body[2]);
          var textLines = pdf.splitTextToSize(text, maxW - indent);
          for (var ti = 0; ti < textLines.length; ti++) {
            if (ti > 0 && startY > pageH - marginB) { pdf.addPage(); startY = marginT; }
            pdf.text(textLines[ti], startX + indent, startY);
            startY += lineHv;
          }
          return startY;
        }

        function pdfRenderBlockquote(text, startX, startY, maxW) {
          var lineHv = lh(theme.sizes.body);
          var indent = 5;
          if (startY + lineHv > pageH - marginB) { pdf.addPage(); startY = marginT; }
          pdf.setFont(theme.fonts.body, "italic");
          pdf.setFontSize(theme.sizes.body);
          pdf.setTextColor(87, 96, 106);
          var textLines = pdf.splitTextToSize(text, maxW - indent - 2);
          var bqStartY = startY;
          for (var ti = 0; ti < textLines.length; ti++) {
            if (startY > pageH - marginB) { pdf.addPage(); startY = marginT; bqStartY = startY; }
            pdf.text(textLines[ti], startX + indent, startY);
            startY += lineHv;
          }
          pdf.setFillColor(208, 215, 222);
          pdf.rect(startX, bqStartY - lineHv + 1, 1, startY - bqStartY + lineHv - 1, 'F');
          pdf.setFont(theme.fonts.body, "normal");
          pdf.setTextColor(theme.colors.body[0], theme.colors.body[1], theme.colors.body[2]);
          return startY + 1;
        }

        function pdfRenderHRule(startX, startY, maxW) {
          pdf.setDrawColor(theme.colors.sectionDivider[0], theme.colors.sectionDivider[1], theme.colors.sectionDivider[2]);
          pdf.setLineWidth(0.3);
          pdf.line(startX, startY, startX + maxW, startY);
          pdf.setDrawColor(0, 0, 0);
          return startY + 4;
        }

        function pdfRenderTable(rows, startX, startY, maxW) {
          var parsedRows = rows.filter(function(r) {
            return !r.trim().match(/^\|[\s\-:|]+\|$/);
          }).map(function(r) {
            return r.split('|').slice(1, -1).map(function(c) { return c.trim(); });
          });
          if (parsedRows.length === 0) return startY;
          var colCount = parsedRows[0].length;
          if (colCount === 0) return startY;
          var colWidth = maxW / colCount;
          var rowHeight = 6;
          if (startY + rowHeight * 2 > pageH - marginB) { pdf.addPage(); startY = marginT; }
          for (var ri = 0; ri < parsedRows.length; ri++) {
            if (startY + rowHeight > pageH - marginB) { pdf.addPage(); startY = marginT; }
            var row = parsedRows[ri];
            for (var ci = 0; ci < row.length; ci++) {
              var cellX = startX + ci * colWidth;
              if (ri === 0) {
                pdf.setFillColor(246, 248, 250);
                pdf.rect(cellX, startY, colWidth, rowHeight, 'F');
                pdf.setFont(theme.fonts.body, "bold");
              } else {
                pdf.setFont(theme.fonts.body, "normal");
              }
              pdf.setDrawColor(208, 215, 222);
              pdf.setLineWidth(0.2);
              pdf.rect(cellX, startY, colWidth, rowHeight, 'S');
              pdf.setFontSize(8.5);
              pdf.setTextColor(theme.colors.body[0], theme.colors.body[1], theme.colors.body[2]);
              var cellText = pdf.splitTextToSize(row[ci] || '', colWidth - 3);
              pdf.text(cellText[0] || '', cellX + 1.5, startY + 4);
            }
            startY += rowHeight;
          }
          pdf.setFontSize(theme.sizes.body);
          pdf.setFont(theme.fonts.body, "normal");
          return startY + 3;
        }

        function pdfRenderInlinePara(text, startX, startY, maxW) {
          var clean = text
            .replace(/\*\*([^*]+)\*\*/g, "$1")
            .replace(/\*([^*]+)\*/g, "$1")
            .replace(/__([^_]+)__/g, "$1")
            .replace(/_([^_]+)_/g, "$1")
            .replace(/`([^`]+)`/g, "$1")
            .replace(/<[^>]+>/g, "");
          var lineHv = lh(theme.sizes.body);
          if (!clean.trim()) return startY + lineHv * 0.3;
          pdf.setFont(theme.fonts.body, "normal");
          pdf.setFontSize(theme.sizes.body);
          pdf.setTextColor(theme.colors.body[0], theme.colors.body[1], theme.colors.body[2]);
          var textLines = pdf.splitTextToSize(clean, maxW);
          for (var ti = 0; ti < textLines.length; ti++) {
            if (startY > pageH - marginB) { pdf.addPage(); startY = marginT; }
            pdf.text(textLines[ti], startX, startY);
            startY += lineHv;
          }
          return startY;
        }

        function pdfRenderMarkdown(markdown, startX, startY, maxW) {
          if (!markdown) return startY;
          var lines = markdown.split('\n');
          var inCodeBlock = false;
          var codeBlockLines = [];
          var tableRows = [];
          for (var i = 0; i < lines.length; i++) {
            var line = lines[i];
            // Code block detection
            if (line.trim().indexOf('```') === 0) {
              if (inCodeBlock) {
                startY = pdfRenderCodeBlock(codeBlockLines, startX, startY, maxW);
                codeBlockLines = [];
                inCodeBlock = false;
              } else {
                inCodeBlock = true;
              }
              continue;
            }
            if (inCodeBlock) { codeBlockLines.push(line); continue; }
            // Table detection
            if (line.trim().charAt(0) === '|' && line.trim().charAt(line.trim().length - 1) === '|') {
              tableRows.push(line);
              continue;
            } else if (tableRows.length > 0) {
              startY = pdfRenderTable(tableRows, startX, startY, maxW);
              tableRows = [];
            }
            // Headings
            if (line.indexOf('### ') === 0) { startY = pdfRenderHeading(line.slice(4), 3, startX, startY, maxW); continue; }
            if (line.indexOf('## ') === 0) { startY = pdfRenderHeading(line.slice(3), 2, startX, startY, maxW); continue; }
            if (line.indexOf('# ') === 0) { startY = pdfRenderHeading(line.slice(2), 1, startX, startY, maxW); continue; }
            // Bullet lists
            if (line.match(/^\s*[-*]\s/)) { startY = pdfRenderBullet(line.replace(/^\s*[-*]\s/, ''), startX, startY, maxW); continue; }
            // Numbered lists
            if (line.match(/^\s*\d+\.\s/)) { startY = pdfRenderNumberedItem(line, startX, startY, maxW); continue; }
            // Blockquote
            if (line.indexOf('> ') === 0) { startY = pdfRenderBlockquote(line.slice(2), startX, startY, maxW); continue; }
            // Horizontal rule
            if (line.match(/^---+$/)) { startY = pdfRenderHRule(startX, startY, maxW); continue; }
            // Regular paragraph
            startY = pdfRenderInlinePara(line, startX, startY, maxW);
          }
          if (tableRows.length > 0) startY = pdfRenderTable(tableRows, startX, startY, maxW);
          if (inCodeBlock && codeBlockLines.length > 0) startY = pdfRenderCodeBlock(codeBlockLines, startX, startY, maxW);
          return startY;
        }

        function renderMessageCard(msg) {
          var bgColor, borderColor, accentColor, labelColor, label, contentText;
          var pV = 4; // vertical padding
          var pL = 6; // left padding (inside card, from card left edge)
          var cardX = marginL;
          var cardW = contentW;
          var innerW = cardW - pL - 1 - 4; // -1 accent bar, -4 right padding

          if (msg.isDocument) {
            bgColor = [240, 246, 255]; borderColor = [9, 105, 218]; accentColor = [9, 105, 218];
            labelColor = [9, 105, 218]; label = "[Document] " + (msg.documentName || "attachment");
            contentText = null;
          } else if (msg.isImage) {
            bgColor = [255, 248, 240]; borderColor = [255, 166, 87]; accentColor = [255, 166, 87];
            labelColor = [255, 128, 0]; label = "[Image] " + (msg.imageName || "image");
            contentText = null;
          } else if (msg.isManualContent) {
            bgColor = [240, 255, 244]; borderColor = [45, 164, 78]; accentColor = [45, 164, 78];
            labelColor = [26, 127, 55]; label = "[Content] " + (msg.contentTitle || "content");
            contentText = null;
          } else if (msg.role === "user") {
            bgColor = null; label = null; contentText = msg.content || "";
          } else if (msg.role === "assistant") {
            bgColor = null; label = null; contentText = msg.content || "";
          } else {
            return; // Unknown message type — skip
          }

          if (!bgColor) {
            // Plain text rendering (no card) for user/assistant messages
            if (contentText) {
              if (msg.role === "assistant") {
                y = pdfRenderMarkdown(contentText, marginL, y, contentW);
              } else {
                writeWrapped(contentText, theme.sizes.body, "normal");
              }
              y += theme.spacing.paragraphGap;
            }
            return;
          }

          var labelLineH = lh(theme.sizes.body) + 1;
          var bodyLineH = lh(theme.sizes.body);
          var pageMaxH = pageH - marginT - marginB - 10;

          // Estimate content height for short messages (plain-text estimate)
          pdf.setFont(theme.fonts.body, "normal");
          pdf.setFontSize(theme.sizes.body);
          var estimatedLines = 0;
          if (contentText) {
            var textToMeasure = msg.role === "assistant" ? stripMarkdown(contentText) : contentText;
            estimatedLines = pdf.splitTextToSize(textToMeasure, innerW).length;
          }
          var estimatedContentH = contentText ? (estimatedLines * bodyLineH + pV) : 0;
          var cardH = pV * 2 + (label ? labelLineH : 0) + estimatedContentH;
          var isLongMessage = cardH > pageMaxH * 0.75;

          if (!isLongMessage) {
            // SHORT MESSAGE: draw full card with background
            checkBreak(cardH);
            var cardY = y;
            pdf.setFillColor(bgColor[0], bgColor[1], bgColor[2]);
            pdf.rect(cardX, cardY, cardW, cardH, 'F');
            pdf.setDrawColor(borderColor[0], borderColor[1], borderColor[2]);
            pdf.setLineWidth(0.3);
            pdf.rect(cardX, cardY, cardW, cardH, 'S');
            pdf.setFillColor(accentColor[0], accentColor[1], accentColor[2]);
            pdf.rect(cardX, cardY, 1, cardH, 'F');
            y = cardY + pV;
            if (label) {
              pdf.setFont(theme.fonts.body, "bold");
              pdf.setFontSize(theme.sizes.body);
              pdf.setTextColor(labelColor[0], labelColor[1], labelColor[2]);
              pdf.text(label, cardX + pL, y);
              y += labelLineH;
            }
            if (contentText) {
              pdf.setFont(theme.fonts.body, "normal");
              pdf.setTextColor(theme.colors.body[0], theme.colors.body[1], theme.colors.body[2]);
              var wrappedContent = pdf.splitTextToSize(
                msg.role === "assistant" ? stripMarkdown(contentText) : contentText,
                innerW
              );
              var maxContentY = cardY + cardH - pV;
              for (var li = 0; li < wrappedContent.length; li++) {
                if (y + bodyLineH > maxContentY) { break; }
                pdf.text(wrappedContent[li], cardX + pL, y);
                y += bodyLineH;
              }
            }
            y = cardY + cardH + theme.spacing.paragraphGap;
          } else {
            // LONG MESSAGE: colored header card + full markdown/text content below
            var headerH = pV * 2 + (label ? labelLineH : 0);
            checkBreak(headerH);
            var headerY = y;
            pdf.setFillColor(bgColor[0], bgColor[1], bgColor[2]);
            pdf.rect(cardX, headerY, cardW, headerH, 'F');
            pdf.setDrawColor(borderColor[0], borderColor[1], borderColor[2]);
            pdf.setLineWidth(0.3);
            pdf.rect(cardX, headerY, cardW, headerH, 'S');
            pdf.setFillColor(accentColor[0], accentColor[1], accentColor[2]);
            pdf.rect(cardX, headerY, 1, headerH, 'F');
            y = headerY + pV;
            if (label) {
              pdf.setFont(theme.fonts.body, "bold");
              pdf.setFontSize(theme.sizes.body);
              pdf.setTextColor(labelColor[0], labelColor[1], labelColor[2]);
              pdf.text(label, cardX + pL, y);
            }
            y = headerY + headerH + 2;
            if (contentText) {
              var contentStartY = y;
              pdf.setFillColor(accentColor[0], accentColor[1], accentColor[2]);
              if (msg.role === "assistant") {
                y = pdfRenderMarkdown(contentText, cardX + pL + 1, y, innerW);
              } else {
                writeWrapped(contentText, theme.sizes.body, "normal", pL + 1);
              }
              // Draw left accent bar alongside content (on current page only)
              var accentBarH = Math.min(y, pageH - marginB) - contentStartY;
              if (accentBarH > 0) {
                pdf.setFillColor(accentColor[0], accentColor[1], accentColor[2]);
                pdf.rect(cardX, contentStartY, 1, accentBarH, 'F');
              }
            }
            y += theme.spacing.paragraphGap;
          }

          pdf.setFont(theme.fonts.body, "normal");
          pdf.setFontSize(theme.sizes.body);
          pdf.setTextColor(theme.colors.body[0], theme.colors.body[1], theme.colors.body[2]);
        }

        var docTitle = db.summaryTitle || "Document Summary";
        var totalJobs = db.jobs.length;
        var totalExchanges = db.jobs.reduce(function(acc, j) {
          return acc + Math.floor((j.messages.length - 1) / 2);
        }, 0);
        var sectionPages = {};
        var now = new Date();
        var dateStr = now.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
        var dateFileStr = now.toISOString().slice(0, 10);

        // ===== PAGE 1: COVER =====
        var coverStyle = theme.decorations.coverStyle || "centered";
        if (coverStyle === "left-aligned") {
          // Accent bar on left side
          if (theme.decorations.coverAccentBar) {
            var abc = theme.decorations.accentBarColor;
            pdf.setFillColor(abc[0], abc[1], abc[2]);
            pdf.rect(0, 0, 8, pageH, "F");
          }
          pdf.setFillColor(...theme.colors.coverBg);
          pdf.rect(8, 0, pageW - 8, pageH, "F");
          var ty = pageH * 0.38;
          pdf.setFont(theme.fonts.heading, "bold");
          pdf.setFontSize(theme.sizes.title);
          pdf.setTextColor(...theme.colors.title);
          var titleLines = pdf.splitTextToSize(docTitle, contentW - 10);
          titleLines.forEach(function(line) {
            pdf.text(line, marginL + 8, ty);
            ty += lh(theme.sizes.title) + 1;
          });
          ty += 4;
          pdf.setFontSize(theme.sizes.h3);
          pdf.setFont(theme.fonts.body, "normal");
          pdf.setTextColor(...theme.colors.secondary);
          if (theme.decorations.showTimestamp) { pdf.text(dateStr, marginL + 8, ty); ty += lh(theme.sizes.h3) + 3; }
          pdf.setTextColor(...theme.colors.muted);
          pdf.setFontSize(theme.sizes.small);
          pdf.text("Job Sections: " + totalJobs, marginL + 8, ty); ty += lh(theme.sizes.small) + 2;
          pdf.text("Total Exchanges: " + totalExchanges, marginL + 8, ty);
        } else if (coverStyle === "minimal") {
          pdf.setFillColor(...theme.colors.coverBg);
          pdf.rect(0, 0, pageW, pageH, "F");
          var ty = pageH * 0.42;
          pdf.setFont(theme.fonts.heading, "bold");
          pdf.setFontSize(theme.sizes.title);
          pdf.setTextColor(...theme.colors.title);
          var titleLines = pdf.splitTextToSize(docTitle, contentW);
          titleLines.forEach(function(line) {
            pdf.text(line, pageW / 2, ty, { align: "center" });
            ty += lh(theme.sizes.title) + 1;
          });
          ty += 4;
          if (theme.decorations.showTimestamp) {
            pdf.setFontSize(theme.sizes.body);
            pdf.setFont(theme.fonts.body, "normal");
            pdf.setTextColor(...theme.colors.muted);
            pdf.text(dateStr, pageW / 2, ty, { align: "center" });
          }
        } else {
          // centered (default)
          if (theme.decorations.coverAccentBar) {
            var abc = theme.decorations.accentBarColor;
            pdf.setFillColor(abc[0], abc[1], abc[2]);
            pdf.rect(0, 0, pageW, 3, "F");
          }
          pdf.setFillColor(...theme.colors.coverBg);
          pdf.rect(0, 3, pageW, pageH - 3, "F");
          // Cover accent bar below header area
          if (theme.decorations.coverAccentBar) {
            var abc = theme.decorations.accentBarColor;
            pdf.setFillColor(abc[0], abc[1], abc[2]);
            pdf.rect(0, 55, pageW, 4, "F");
          }
          pdf.setFont(theme.fonts.heading, "bold");
          pdf.setFontSize(theme.sizes.title);
          pdf.setTextColor(...theme.colors.title);
          var titleLines = pdf.splitTextToSize(docTitle, contentW);
          var ty = 28;
          titleLines.forEach(function(line) {
            pdf.text(line, pageW / 2, ty, { align: "center" });
            ty += lh(theme.sizes.title);
          });
          if (theme.decorations.showTimestamp) {
            pdf.setFontSize(theme.sizes.h3);
            pdf.setFont(theme.fonts.body, "normal");
            pdf.setTextColor(...theme.colors.secondary);
            pdf.text(dateStr, pageW / 2, ty + 4, { align: "center" });
          }
          pdf.setTextColor(...theme.colors.body);
          y = 72;
          pdf.setFontSize(theme.sizes.body);
          pdf.setFont(theme.fonts.body, "normal");
          pdf.text("Job Sections: " + totalJobs, pageW / 2, y, { align: "center" });
          y += 8;
          pdf.text("Total Exchanges: " + totalExchanges, pageW / 2, y, { align: "center" });
        }

        // ===== PAGE 2: TABLE OF CONTENTS (placeholder) =====
        pdf.addPage();
        var tocPage = pdf.internal.getCurrentPageInfo().pageNumber;
        // Content will be filled in after all sections are rendered

        // ===== PAGE 3+: DOCUMENT SUMMARY =====
        pdf.addPage();
        sectionPages["summary"] = pdf.internal.getCurrentPageInfo().pageNumber;
        y = marginT;
        pdf.setFont(theme.fonts.heading, "bold");
        pdf.setFontSize(theme.sizes.h1);
        pdf.setTextColor(...theme.colors.heading);
        pdf.text(docTitle, marginL, y);
        y += lh(theme.sizes.h1) + 2;
        hRule();
        y += 2;
        var summaryText = stripHtmlToText(db.summary || "").trim();
        if (!summaryText) { summaryText = "No summary content."; }
        writeWrapped(summaryText, theme.sizes.body, "normal");
        y += theme.spacing.paragraphGap;

        // ===== JOB SECTIONS =====
        db.jobs.forEach(function(job) {
          pdf.addPage();
          sectionPages["job_" + job.id] = pdf.internal.getCurrentPageInfo().pageNumber;
          y = marginT + 3;

          // Divider line before job section title
          if (y > marginT + 5) {
            pdf.setDrawColor(theme.colors.sectionDivider[0], theme.colors.sectionDivider[1], theme.colors.sectionDivider[2]);
            pdf.setLineWidth(0.5);
            pdf.line(marginL, y, marginL + contentW, y);
            y += 5;
          }

          // Styled job section header: colored dot + job name
          // Colored dot (job color)
          var dotColor = job.color || "#58a6ff";
          var dc = hexToRgbLocal(dotColor);
          pdf.setFillColor(dc[0], dc[1], dc[2]);
          pdf.circle(marginL + 3, y - 1, 2, 'F');
          pdf.setFont(theme.fonts.heading, "bold");
          pdf.setFontSize(theme.sizes.h1);
          pdf.setTextColor(theme.colors.heading[0], theme.colors.heading[1], theme.colors.heading[2]);
          var jLines = pdf.splitTextToSize(job.name, contentW - 10);
          jLines.forEach(function(line) { pdf.text(line, marginL + 8, y); y += lh(theme.sizes.h1); });
          y += 2;
          if (theme.decorations.showSectionDividers) { hRule(); }

          // Chat messages — rendered as plain text
          job.messages.slice(1).forEach(function(msg) {
            renderMessageCard(msg);
          });

          // Notes sub-section
          if (job.notes && job.notes.trim()) {
            checkBreak(20);
            sectionPages["notes_" + job.id] = pdf.internal.getCurrentPageInfo().pageNumber;
            y += 8;
            // Divider line before notes heading
            pdf.setDrawColor(theme.colors.sectionDivider[0], theme.colors.sectionDivider[1], theme.colors.sectionDivider[2]);
            pdf.setLineWidth(0.3);
            pdf.line(marginL, y, marginL + contentW, y);
            y += 4;
            pdf.setFont(theme.fonts.heading, "bold");
            pdf.setFontSize(theme.sizes.h3);
            pdf.setTextColor(theme.colors.heading[0], theme.colors.heading[1], theme.colors.heading[2]);
            var nhLines = pdf.splitTextToSize("Notes for " + job.name, contentW);
            nhLines.forEach(function(line) { pdf.text(line, marginL, y); y += lh(theme.sizes.h3); });
            y += 1;
            if (theme.decorations.showSectionDividers) { hRule(0.2); }
            y += 2;
            writeWrapped(job.notes.trim(), theme.sizes.body, "normal");
            y += theme.spacing.sectionGap;
          }
        });

        // ===== PAGE HEADERS & FOOTERS =====
        var totalPages = pdf.internal.getNumberOfPages();
        for (var p = 1; p <= totalPages; p++) {
          pdf.setPage(p);
          pdf.setFontSize(theme.sizes.footer);
          pdf.setFont(theme.fonts.body, "normal");
          pdf.setTextColor(...theme.colors.muted);
          if (theme.decorations.showFooterLine) {
            pdf.text("Page " + p + " of " + totalPagesAlias, pageW / 2, pageH - 8, { align: "center" });
          }
          if (p > 1 && theme.decorations.showHeaderLine) {
            pdf.text(docTitle, marginL, theme.spacing.headerHeight - 2);
            pdf.setLineWidth(0.2);
            var hlc = theme.colors.headerLine;
            pdf.setDrawColor(hlc[0], hlc[1], hlc[2]);
            pdf.line(marginL, theme.spacing.headerHeight, pageW - theme.spacing.marginRight, theme.spacing.headerHeight);
            pdf.setDrawColor(0, 0, 0);
          }
          pdf.setTextColor(...theme.colors.body);
        }

        // ===== FILL IN TABLE OF CONTENTS =====
        pdf.setPage(tocPage);
        y = marginT;
        pdf.setFont(theme.fonts.heading, "bold");
        pdf.setFontSize(theme.sizes.h1);
        pdf.setTextColor(...theme.colors.heading);
        pdf.text("Table of Contents", marginL, y);
        y += lh(theme.sizes.h1) + 2;
        var hlc = theme.colors.headerLine;
        pdf.setLineWidth(0.3);
        pdf.setDrawColor(hlc[0], hlc[1], hlc[2]);
        pdf.line(marginL, y, pageW - theme.spacing.marginRight, y);
        pdf.setDrawColor(0, 0, 0);
        y += 6;

        function tocEntry(label, pgNum, indent) {
          indent = indent || 0;
          pdf.setFontSize(theme.sizes.body);
          pdf.setFont(theme.fonts.body, "normal");
          pdf.setTextColor(...theme.colors.body);
          var pgStr = pgNum !== undefined ? ("" + pgNum) : "?";
          var xL = marginL + indent;
          var xR = pageW - theme.spacing.marginRight;
          var availW = contentW - indent;
          var labelW = pdf.getTextWidth(label + "  ");
          var pgW = pdf.getTextWidth("  " + pgStr);
          var dotsAvail = availW - labelW - pgW;
          var dotW = pdf.getTextWidth(".");
          var numDots = Math.max(3, Math.floor(dotsAvail / dotW));
          var tocStyle = theme.decorations.tocStyle || "dotted";
          if (tocStyle === "plain") {
            pdf.text(label, xL, y);
            pdf.text(pgStr, xR, y, { align: "right" });
          } else if (tocStyle === "lined") {
            pdf.text(label, xL, y);
            pdf.text(pgStr, xR, y, { align: "right" });
            var dc = theme.colors.tocDots;
            pdf.setDrawColor(dc[0], dc[1], dc[2]);
            pdf.setLineWidth(0.1);
            pdf.line(xL + labelW, y + 0.5, xR - pgW, y + 0.5);
            pdf.setDrawColor(0, 0, 0);
          } else {
            // dotted (default)
            var dc = theme.colors.tocDots;
            pdf.setTextColor(dc[0], dc[1], dc[2]);
            var dots = ".".repeat(numDots);
            pdf.setTextColor(...theme.colors.body);
            pdf.text(label, xL, y);
            pdf.setTextColor(dc[0], dc[1], dc[2]);
            pdf.text(dots, xL + labelW, y);
            pdf.setTextColor(...theme.colors.body);
            pdf.text(pgStr, xR, y, { align: "right" });
          }
          y += lh(theme.sizes.body) + 2;
        }

        tocEntry("Document Summary", sectionPages["summary"]);
        y += 2;
        db.jobs.forEach(function(job) {
          tocEntry("Job: " + job.name, sectionPages["job_" + job.id]);
          if (job.notes && job.notes.trim() && sectionPages["notes_" + job.id]) {
            tocEntry("Notes: " + job.name, sectionPages["notes_" + job.id], 5);
          }
        });

        // Resolve total pages placeholder and save
        pdf.putTotalPages(totalPagesAlias);
        var filename = (db.summaryTitle || "document-summary").replace(/[^a-z0-9_\-]/gi, "_") + "_" + dateFileStr + ".pdf";
        pdf.save(filename);
      } catch (err) {
        alert("PDF export failed: " + err.message);
      }
      if (btn) { btn.textContent = "📄 PDF"; btn.disabled = false; }
    }

    // ===== WORD EXPORT =====

    async function exportToWord(btn) {
      if (!window.JSZip) {
        alert("JSZip library is still loading. Please try again in a moment.");
        return;
      }
      if (btn) { btn.textContent = "⏳ Generating…"; btn.disabled = true; }
      try {
        saveCurrentNotes();
        var se = document.getElementById("summary-editor");
        if (se) db.summary = se.innerHTML;

        var theme = getActivePdfTheme();

        function escapeXml(str) {
          if (!str) return "";
          return ("" + str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&apos;");
        }

        function rgbToWordHex(arr) {
          return arr.map(function(v) {
            return ("0" + Math.max(0, Math.min(255, v)).toString(16)).slice(-2);
          }).join("").toUpperCase();
        }

        var headingHex = rgbToWordHex(theme.colors.heading);
        var bodyHex = rgbToWordHex(theme.colors.body);
        var secondaryHex = rgbToWordHex(theme.colors.secondary);
        var accentHex = rgbToWordHex(theme.colors.accent);

        var headingFont = theme.fonts.heading;
        var bodyFont = theme.fonts.body;

        var titleSz = Math.round(theme.sizes.title * 2);
        var h1Sz = Math.round(theme.sizes.h1 * 2);
        var h2Sz = Math.round(theme.sizes.h2 * 2);
        var h3Sz = Math.round(theme.sizes.h3 * 2);
        var bodySz = Math.round(theme.sizes.body * 2);

        var docTitle = db.summaryTitle || "Document Summary";
        var totalJobs = db.jobs.length;
        var totalExchanges = db.jobs.reduce(function(acc, j) {
          return acc + Math.floor((j.messages.length - 1) / 2);
        }, 0);
        var now = new Date();
        var dateStr = now.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
        var dateFileStr = now.toISOString().slice(0, 10);

        function makeRun(text, opts) {
          opts = opts || {};
          var rPr = "";
          if (opts.font) rPr += '<w:rFonts w:ascii="' + escapeXml(opts.font) + '" w:hAnsi="' + escapeXml(opts.font) + '"/>';
          if (opts.bold) rPr += "<w:b/>";
          if (opts.italic) rPr += "<w:i/>";
          if (opts.color) rPr += '<w:color w:val="' + opts.color + '"/>';
          if (opts.sz) rPr += '<w:sz w:val="' + opts.sz + '"/><w:szCs w:val="' + opts.sz + '"/>';
          if (rPr) rPr = "<w:rPr>" + rPr + "</w:rPr>";
          var t = text != null ? String(text) : "";
          var spaceAttr = (t.charAt(0) === " " || t.charAt(t.length - 1) === " ") ? ' xml:space="preserve"' : "";
          return "<w:r>" + rPr + "<w:t" + spaceAttr + ">" + escapeXml(t) + "</w:t></w:r>";
        }

        function makePara(runs, opts) {
          opts = opts || {};
          var pPr = "";
          if (opts.pageBreakBefore) pPr += "<w:pageBreakBefore/>";
          var spacingAttr = "";
          if (opts.spaceAfter != null) spacingAttr += ' w:after="' + opts.spaceAfter + '"';
          if (opts.spaceBefore != null) spacingAttr += ' w:before="' + opts.spaceBefore + '"';
          if (spacingAttr) pPr += "<w:spacing" + spacingAttr + "/>";
          if (opts.indent != null) pPr += '<w:ind w:left="' + opts.indent + '"/>';
          if (pPr) pPr = "<w:pPr>" + pPr + "</w:pPr>";
          return "<w:p>" + pPr + (runs || "") + "</w:p>";
        }

        function pageBreakPara() {
          return "<w:p><w:r><w:br w:type=\"page\"/></w:r></w:p>";
        }

        function textParas(text, opts) {
          var xml = "";
          var lines = (text || "").split("\n");
          lines.forEach(function(line) {
            xml += makePara(makeRun(line || " ", opts), { spaceAfter: 80 });
          });
          return xml;
        }

        // ===== WORD MARKDOWN RENDERER =====

        function wordRenderMarkdown(markdown) {
          if (!markdown) return "";
          var result = "";
          var lines = markdown.split('\n');
          var inCodeBlock = false;
          var codeBlockLines = [];
          var tableRows = [];
          var codeSz = Math.round(8.5 * 2); // 8.5pt converted to half-points for Word XML

          function parseInlineRuns(text) {
            var runs = "";
            var i = 0;
            var len = text.length;
            var plain = "";
            while (i < len) {
              if (text[i] === '`') {
                var end = text.indexOf('`', i + 1);
                if (end !== -1) {
                  if (plain) { runs += makeRun(plain, { font: bodyFont, sz: bodySz, color: bodyHex }); plain = ""; }
                  var codeVal = text.slice(i + 1, end);
                  var spAttr = (codeVal.charAt(0) === ' ' || codeVal.charAt(codeVal.length - 1) === ' ') ? ' xml:space="preserve"' : '';
                  runs += '<w:r><w:rPr>' +
                    '<w:rFonts w:ascii="Courier New" w:hAnsi="Courier New"/>' +
                    '<w:color w:val="' + bodyHex + '"/>' +
                    '<w:sz w:val="' + codeSz + '"/><w:szCs w:val="' + codeSz + '"/>' +
                    '<w:shd w:val="clear" w:color="auto" w:fill="F6F8FA"/>' +
                    '</w:rPr><w:t' + spAttr + '>' + escapeXml(codeVal) + '</w:t></w:r>';
                  i = end + 1;
                  continue;
                }
              }
              if (text[i] === '*' && i + 1 < len && text[i + 1] === '*') {
                var end2 = text.indexOf('**', i + 2);
                if (end2 !== -1) {
                  if (plain) { runs += makeRun(plain, { font: bodyFont, sz: bodySz, color: bodyHex }); plain = ""; }
                  runs += makeRun(text.slice(i + 2, end2), { bold: true, font: bodyFont, sz: bodySz, color: bodyHex });
                  i = end2 + 2;
                  continue;
                }
              }
              if (text[i] === '*') {
                var end3 = text.indexOf('*', i + 1);
                if (end3 !== -1) {
                  if (plain) { runs += makeRun(plain, { font: bodyFont, sz: bodySz, color: bodyHex }); plain = ""; }
                  runs += makeRun(text.slice(i + 1, end3), { italic: true, font: bodyFont, sz: bodySz, color: bodyHex });
                  i = end3 + 1;
                  continue;
                }
              }
              if (text[i] === '_' && i + 1 < len && text[i + 1] === '_') {
                var end4 = text.indexOf('__', i + 2);
                if (end4 !== -1) {
                  if (plain) { runs += makeRun(plain, { font: bodyFont, sz: bodySz, color: bodyHex }); plain = ""; }
                  runs += makeRun(text.slice(i + 2, end4), { bold: true, font: bodyFont, sz: bodySz, color: bodyHex });
                  i = end4 + 2;
                  continue;
                }
              }
              if (text[i] === '_') {
                var end5 = text.indexOf('_', i + 1);
                if (end5 !== -1) {
                  if (plain) { runs += makeRun(plain, { font: bodyFont, sz: bodySz, color: bodyHex }); plain = ""; }
                  runs += makeRun(text.slice(i + 1, end5), { italic: true, font: bodyFont, sz: bodySz, color: bodyHex });
                  i = end5 + 1;
                  continue;
                }
              }
              plain += text[i];
              i++;
            }
            if (plain) { runs += makeRun(plain, { font: bodyFont, sz: bodySz, color: bodyHex }); }
            return runs;
          }

          function flushCodeBlock(clines) {
            var xml = "";
            clines.forEach(function(cl) {
              // Use a single space for empty lines so Word XML doesn't collapse/omit them
              var t = cl || " ";
              var spAttr = (t.charAt(0) === ' ' || t.charAt(t.length - 1) === ' ') ? ' xml:space="preserve"' : '';
              xml += '<w:p>' +
                '<w:pPr><w:shd w:val="clear" w:color="auto" w:fill="161B22"/><w:spacing w:after="0"/></w:pPr>' +
                '<w:r>' +
                '<w:rPr>' +
                '<w:rFonts w:ascii="Courier New" w:hAnsi="Courier New"/>' +
                '<w:color w:val="E6EDF3"/>' +
                '<w:sz w:val="' + codeSz + '"/><w:szCs w:val="' + codeSz + '"/>' +
                '<w:shd w:val="clear" w:color="auto" w:fill="161B22"/>' +
                '</w:rPr>' +
                '<w:t' + spAttr + '>' + escapeXml(t) + '</w:t>' +
                '</w:r>' +
                '</w:p>';
            });
            xml += makePara("", { spaceAfter: 80 });
            return xml;
          }

          function flushTable(rows) {
            var parsedRows = rows.filter(function(r) {
              return !r.trim().match(/^\|[\s\-:|]+\|$/);
            }).map(function(r) {
              return r.split('|').slice(1, -1).map(function(c) { return c.trim(); });
            });
            if (!parsedRows.length) return '';
            var colCount = parsedRows[0].length;
            if (!colCount) return '';
            var tblSz = Math.round(8.5 * 2);
            var xml = '<w:tbl>' +
              '<w:tblPr>' +
              '<w:tblW w:w="0" w:type="auto"/>' +
              '<w:tblBorders>' +
              '<w:top w:val="single" w:sz="4" w:space="0" w:color="D0D7DE"/>' +
              '<w:left w:val="single" w:sz="4" w:space="0" w:color="D0D7DE"/>' +
              '<w:bottom w:val="single" w:sz="4" w:space="0" w:color="D0D7DE"/>' +
              '<w:right w:val="single" w:sz="4" w:space="0" w:color="D0D7DE"/>' +
              '<w:insideH w:val="single" w:sz="4" w:space="0" w:color="D0D7DE"/>' +
              '<w:insideV w:val="single" w:sz="4" w:space="0" w:color="D0D7DE"/>' +
              '</w:tblBorders>' +
              '</w:tblPr>';
            parsedRows.forEach(function(row, ri) {
              xml += '<w:tr>';
              row.forEach(function(cell) {
                xml += '<w:tc>';
                if (ri === 0) {
                  xml += '<w:tcPr><w:shd w:val="clear" w:color="auto" w:fill="F6F8FA"/></w:tcPr>';
                }
                xml += '<w:p><w:pPr><w:spacing w:after="40"/></w:pPr>';
                xml += makeRun(cell, { bold: ri === 0, font: bodyFont, sz: tblSz, color: bodyHex });
                xml += '</w:p></w:tc>';
              });
              xml += '</w:tr>';
            });
            xml += '</w:tbl>';
            xml += makePara("", { spaceAfter: 80 });
            return xml;
          }

          for (var li = 0; li < lines.length; li++) {
            var line = lines[li];

            if (line.trim().indexOf('```') === 0) {
              if (inCodeBlock) {
                result += flushCodeBlock(codeBlockLines);
                codeBlockLines = [];
                inCodeBlock = false;
              } else {
                inCodeBlock = true;
              }
              continue;
            }
            if (inCodeBlock) { codeBlockLines.push(line); continue; }

            if (line.trim().charAt(0) === '|' && line.trim().charAt(line.trim().length - 1) === '|') {
              tableRows.push(line);
              continue;
            } else if (tableRows.length > 0) {
              result += flushTable(tableRows);
              tableRows = [];
            }

            if (line.indexOf('### ') === 0) {
              result += makePara(makeRun(line.slice(4), { bold: true, font: headingFont, sz: h3Sz, color: headingHex }), { spaceBefore: 100, spaceAfter: 80 });
              continue;
            }
            if (line.indexOf('## ') === 0) {
              result += makePara(makeRun(line.slice(3), { bold: true, font: headingFont, sz: h2Sz, color: headingHex }), { spaceBefore: 160, spaceAfter: 100 });
              continue;
            }
            if (line.indexOf('# ') === 0) {
              result += makePara(makeRun(line.slice(2), { bold: true, font: headingFont, sz: h1Sz, color: headingHex }), { spaceBefore: 240, spaceAfter: 120 });
              continue;
            }

            if (line.match(/^\s*[-*]\s/)) {
              var bulletText = line.replace(/^\s*[-*]\s/, '');
              result += '<w:p>' +
                '<w:pPr><w:ind w:left="360"/><w:spacing w:after="80"/></w:pPr>' +
                makeRun('\u2022 ', { font: bodyFont, sz: bodySz, color: bodyHex }) +
                parseInlineRuns(bulletText) +
                '</w:p>';
              continue;
            }

            if (line.match(/^\s*\d+\.\s/)) {
              result += '<w:p>' +
                '<w:pPr><w:ind w:left="360"/><w:spacing w:after="80"/></w:pPr>' +
                parseInlineRuns(line) +
                '</w:p>';
              continue;
            }

            if (line.indexOf('> ') === 0) {
              result += '<w:p>' +
                '<w:pPr>' +
                '<w:ind w:left="360"/>' +
                '<w:spacing w:after="80"/>' +
                '<w:pBdr><w:left w:val="single" w:sz="12" w:space="4" w:color="D0D7DE"/></w:pBdr>' +
                '</w:pPr>' +
                makeRun(line.slice(2), { italic: true, font: bodyFont, sz: bodySz, color: "57606A" }) +
                '</w:p>';
              continue;
            }

            if (line.match(/^---+$/)) {
              result += '<w:p>' +
                '<w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="D0D7DE"/></w:pBdr>' +
                '<w:spacing w:after="80"/></w:pPr>' +
                '</w:p>';
              continue;
            }

            if (!line.trim()) {
              result += makePara("", { spaceAfter: 80 });
            } else {
              result += makePara(parseInlineRuns(line), { spaceAfter: 80 });
            }
          }

          if (tableRows.length > 0) result += flushTable(tableRows);
          if (inCodeBlock && codeBlockLines.length > 0) result += flushCodeBlock(codeBlockLines);

          return result;
        }

        var body = "";

        // ===== COVER PAGE =====
        body += makePara(makeRun(docTitle, { bold: true, font: headingFont, sz: titleSz, color: headingHex }), { spaceAfter: 400 });
        body += makePara(makeRun(dateStr, { font: bodyFont, sz: h3Sz, color: bodyHex }), { spaceAfter: 200 });
        body += makePara(makeRun("Job Sections: " + totalJobs, { font: bodyFont, sz: bodySz, color: bodyHex }), { spaceAfter: 100 });
        body += makePara(makeRun("Total Exchanges: " + totalExchanges, { font: bodyFont, sz: bodySz, color: bodyHex }), { spaceAfter: 400 });

        // ===== TABLE OF CONTENTS =====
        body += pageBreakPara();
        body += makePara(makeRun("Table of Contents", { bold: true, font: headingFont, sz: h1Sz, color: headingHex }), { spaceAfter: 240 });
        body += makePara(makeRun("Document Summary", { font: bodyFont, sz: bodySz, color: bodyHex }), { spaceAfter: 100 });
        db.jobs.forEach(function(job) {
          body += makePara(makeRun("Job: " + job.name, { font: bodyFont, sz: bodySz, color: bodyHex }), { spaceAfter: 100 });
          if (job.notes && job.notes.trim()) {
            body += makePara(makeRun("Notes: " + job.name, { font: bodyFont, sz: bodySz, color: bodyHex }), { spaceAfter: 80, indent: 720 });
          }
        });

        // ===== DOCUMENT SUMMARY =====
        body += pageBreakPara();
        body += makePara(makeRun("Document Summary", { bold: true, font: headingFont, sz: h1Sz, color: headingHex }), { spaceAfter: 200 });
        var summaryText = stripHtmlToText(db.summary || "").trim();
        if (!summaryText) summaryText = "No summary content.";
        body += textParas(summaryText, { font: bodyFont, sz: bodySz, color: bodyHex });

        // ===== JOB SECTIONS =====
        db.jobs.forEach(function(job) {
          body += pageBreakPara();
          body += makePara(makeRun(job.name, { bold: true, font: headingFont, sz: h1Sz, color: headingHex }), { spaceAfter: 200 });

          job.messages.slice(1).forEach(function(msg) {
            if (msg.isDocument) {
              body += makePara(makeRun("[Document]: " + (msg.documentName || "attachment"), { bold: true, font: bodyFont, sz: bodySz, color: "0969DA" }), { spaceAfter: 120 });
            } else if (msg.isImage) {
              body += makePara(makeRun("[Image]: " + (msg.imageName || "image"), { bold: true, font: bodyFont, sz: bodySz, color: "FF8000" }), { spaceAfter: 120 });
            } else if (msg.isManualContent) {
              var mcLabel = "[Content]: " + (msg.contentTitle || "content");
              if (msg.contentType) mcLabel += " (" + msg.contentType + ")";
              body += makePara(makeRun(mcLabel, { bold: true, font: bodyFont, sz: bodySz, color: "1A7F37" }), { spaceAfter: 120 });
            } else if (msg.role === "user") {
              body += textParas(msg.content || "", { font: bodyFont, sz: bodySz, color: bodyHex });
              body += makePara("", { spaceAfter: 100 });
            } else if (msg.role === "assistant") {
              body += wordRenderMarkdown(msg.content || "");
              body += makePara("", { spaceAfter: 100 });
            }
          });

          if (job.notes && job.notes.trim()) {
            body += makePara(makeRun("Notes for " + job.name, { bold: true, font: headingFont, sz: h3Sz, color: headingHex }), { spaceBefore: 240, spaceAfter: 160 });
            body += textParas(job.notes.trim(), { font: bodyFont, sz: bodySz, color: bodyHex });
          }
        });

        body += '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/></w:sectPr>';

        var NS = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" ' +
          'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" ' +
          'xmlns:mc="http://schemas.openxmlformats.org/markup-compatibility/2006"';

        var documentXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<w:document ' + NS + '><w:body>' + body + '</w:body></w:document>';

        var stylesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
          '<w:docDefaults><w:rPrDefault><w:rPr>' +
          '<w:rFonts w:ascii="' + escapeXml(bodyFont) + '" w:hAnsi="' + escapeXml(bodyFont) + '"/>' +
          '<w:sz w:val="' + bodySz + '"/><w:szCs w:val="' + bodySz + '"/>' +
          '</w:rPr></w:rPrDefault></w:docDefaults></w:styles>';

        var contentTypesXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
          '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
          '<Default Extension="xml" ContentType="application/xml"/>' +
          '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
          '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
          '</Types>';

        var relsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
          '</Relationships>';

        var docRelsXml = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
          '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
          '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
          '</Relationships>';

        var zip = new JSZip();
        zip.file("[Content_Types].xml", contentTypesXml);
        zip.file("_rels/.rels", relsXml);
        zip.file("word/document.xml", documentXml);
        zip.file("word/styles.xml", stylesXml);
        zip.file("word/_rels/document.xml.rels", docRelsXml);

        var blob = await zip.generateAsync({
          type: "blob",
          mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        });
        var url = URL.createObjectURL(blob);
        var a = document.createElement("a");
        a.href = url;
        a.download = (db.summaryTitle || "document-summary").replace(/[^a-z0-9_\-]/gi, "_") + "_" + dateFileStr + ".docx";
        a.click();
        URL.revokeObjectURL(url);
      } catch (err) {
        alert("Word export failed: " + err.message);
      }
      if (btn) { btn.textContent = "📝 Word"; btn.disabled = false; }
    }

    function rgbToHex(arr) {
      return "#" + arr.map(function(v) {
        return ("0" + Math.max(0, Math.min(255, v)).toString(16)).slice(-2);
      }).join("");
    }

    function hexToRgb(hex) {
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      return [r, g, b];
    }

      function saveTheme() {
        var presetKey = document.getElementById("theme-preset").value;
        var t = readThemeFromForm();
        // Always save the form values; use preset key if no modifications were made
        // (determined by whether the user chose "custom" or a named preset)
        db.pdfTheme = presetKey;
        db.customPdfTheme = (presetKey === "custom") ? t : null;
        // If the preset was selected but values were edited, store as custom
        if (presetKey !== "custom" && PDF_THEMES[presetKey]) {
          var preset = PDF_THEMES[presetKey];
          // Compare only the editable fields to detect modifications
          var modified =
            JSON.stringify(t.colors) !== JSON.stringify(preset.colors) ||
            JSON.stringify(t.fonts) !== JSON.stringify(preset.fonts) ||
            JSON.stringify(t.spacing) !== JSON.stringify(preset.spacing) ||
            JSON.stringify(t.decorations) !== JSON.stringify(preset.decorations);
          if (modified) {
            db.pdfTheme = "custom";
            db.customPdfTheme = t;
          }
        }
        saveDB();
        document.body.removeChild(ov);
      }

    function exportPdfTheme() {

      var a = document.createElement("a");
      a.href = url;
