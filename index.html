    function handleThemeImport(event) {
      var file = event.target.files[0];
      event.target.value = "";
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var t = JSON.parse(e.target.result);
          // Basic validation
          if (!t.colors || !t.fonts || !t.sizes || !t.spacing || !t.decorations) {
            alert("Invalid theme file: missing required sections (colors, fonts, sizes, spacing, decorations).");
            return;
          }
          db.pdfTheme = "custom";
          db.customPdfTheme = t;
          saveDB();
          alert("Theme imported successfully! It has been set as your active theme.");
        } catch (err) {
          alert("Failed to import theme: " + err.message);
        }
      };
      reader.readAsText(file);
    }

    async function handleWordTemplateImport(event) {
      var file = event.target.files[0];
      event.target.value = "";
      if (!file) return;
      if (!window.JSZip) {
        alert("JSZip library is not loaded. Please refresh and try again.");
        return;
      }
      try {
        var zip = await JSZip.loadAsync(file);
        var stylesFile = zip.file("word/styles.xml");
        if (!stylesFile) { alert("Could not find styles in this Word document."); return; }
        var stylesXml = await stylesFile.async("string");
        var parser = new DOMParser();
        var stylesDoc = parser.parseFromString(stylesXml, "application/xml");
        var theme = extractThemeFromWordStyles(stylesDoc);

        // Also try to parse word/theme/theme1.xml
        var themeFile = zip.file("word/theme/theme1.xml");
        if (themeFile) {
          var themeXml = await themeFile.async("string");
          var themeDoc = parser.parseFromString(themeXml, "application/xml");
          theme = applyWordThemeColors(themeDoc, theme);
        }

        db.pdfTheme = "custom";
        db.customPdfTheme = theme;
        saveDB();
        alert(
          "\u2705 Word template styles imported successfully!\n\n" +
          "Extracted:\n" +
          "\u2022 Heading font: " + theme.extractedInfo.headingFont + "\n" +
          "\u2022 Body font: " + theme.extractedInfo.bodyFont + "\n" +
          "\u2022 Primary color: " + theme.extractedInfo.primaryColor + "\n" +
          "\u2022 " + theme.extractedInfo.stylesFound + " styles found"
        );
        var existingModal = document.querySelector(".pdf-theme-modal");
        if (existingModal) {
          document.body.removeChild(existingModal);
          openPdfThemeEditor();
        }
      } catch (err) {
        alert("\u274C Failed to parse Word template: " + err.message);
      }
    }

    function mapWordFont(wordFont) {
      if (!wordFont) return "helvetica";
      var lower = wordFont.toLowerCase();
      if (lower.match(/times|georgia|garamond|palatino|book antiqua|serif/)) return "times";
      if (lower.match(/courier|consolas|monospace|lucida console|monaco/)) return "courier";
      return "helvetica";
    }

    function extractThemeFromWordStyles(stylesDoc) {
      var styles = stylesDoc.getElementsByTagName("w:style");
      var extracted = {
        headingFont: null, bodyFont: null,
        headingColor: null, bodyColor: null, accentColor: null,
        heading1Size: null, heading2Size: null, heading3Size: null, bodySize: null,
        stylesFound: 0
      };

      for (var i = 0; i < styles.length; i++) {
        var style = styles[i];
        var styleId = style.getAttribute("w:styleId") || "";
        var styleType = style.getAttribute("w:type") || "";
        extracted.stylesFound++;

        var rFonts = style.getElementsByTagName("w:rFonts")[0];
        var font = rFonts ? (rFonts.getAttribute("w:ascii") || rFonts.getAttribute("w:hAnsi")) : null;
        var colorNode = style.getElementsByTagName("w:color")[0];
        var color = colorNode ? colorNode.getAttribute("w:val") : null;
        var szNode = style.getElementsByTagName("w:sz")[0];
        var size = szNode ? parseInt(szNode.getAttribute("w:val"), 10) / 2 : null;

        if (styleId === "Heading1" || styleId === "heading1") {
          if (font) extracted.headingFont = font;
          if (color && color !== "auto") extracted.headingColor = color;
          if (size) extracted.heading1Size = size;
        }
        if (styleId === "Heading2" || styleId === "heading2") {
          if (size) extracted.heading2Size = size;
        }
        if (styleId === "Heading3" || styleId === "heading3") {
          if (size) extracted.heading3Size = size;
        }
        if (styleId === "Normal" || styleId === "normal" ||
            (styleType === "paragraph" && !styleId.match(/heading/i) && !extracted.bodyFont)) {
          if (font && !extracted.bodyFont) extracted.bodyFont = font;
          if (color && color !== "auto" && !extracted.bodyColor) extracted.bodyColor = color;
          if (size && !extracted.bodySize) extracted.bodySize = size;
        }
        if (styleId === "Hyperlink" || styleId === "FollowedHyperlink") {
          if (color && color !== "auto") extracted.accentColor = color;
        }
      }

      function hexToRgbWord(hex) {
        if (!hex || hex === "auto") return null;
        hex = hex.replace("#", "");
        if (hex.length !== 6) return null;
        return [
          parseInt(hex.substring(0, 2), 16),
          parseInt(hex.substring(2, 4), 16),
          parseInt(hex.substring(4, 6), 16)
        ];
      }

      var base = JSON.parse(JSON.stringify(PDF_THEMES["professional"]));
      base.name = "Word Import";
      base.fonts.heading = mapWordFont(extracted.headingFont);
      base.fonts.body = mapWordFont(extracted.bodyFont);

      if (extracted.heading1Size) base.sizes.h1 = Math.min(Math.max(extracted.heading1Size, 12), 28);
      if (extracted.heading2Size) base.sizes.h2 = Math.min(Math.max(extracted.heading2Size, 10), 22);
      if (extracted.heading3Size) base.sizes.h3 = Math.min(Math.max(extracted.heading3Size, 9), 18);
      if (extracted.bodySize) base.sizes.body = Math.min(Math.max(extracted.bodySize, 8), 14);

      var headingRgb = hexToRgbWord(extracted.headingColor);
      var bodyRgb = hexToRgbWord(extracted.bodyColor);
      var accentRgb = hexToRgbWord(extracted.accentColor);

      if (headingRgb) {
        base.colors.heading = headingRgb;
        base.colors.title = headingRgb;
      }
      if (bodyRgb) {
        base.colors.body = bodyRgb;
      }
      if (accentRgb) {
        base.colors.primary = accentRgb;
        base.decorations.accentBarColor = accentRgb;
      }

      base.extractedInfo = {
        primaryColor: extracted.headingColor || extracted.accentColor || "default",
        headingFont: extracted.headingFont || "default",
        bodyFont: extracted.bodyFont || "default",
        stylesFound: extracted.stylesFound
      };

      return base;
    }

    function applyWordThemeColors(themeDoc, theme) {
      function hexToRgbWord(hex) {
        if (!hex || hex.length !== 6) return null;
        return [parseInt(hex.substring(0,2),16), parseInt(hex.substring(2,4),16), parseInt(hex.substring(4,6),16)];
      }

      // Parse color scheme from <a:clrScheme>
      var clrSchemes = themeDoc.getElementsByTagName("a:clrScheme");
      if (clrSchemes.length > 0) {
        var clrScheme = clrSchemes[0];
        var colorMap = {};
        for (var ci = 0; ci < clrScheme.children.length; ci++) {
          var colorEl = clrScheme.children[ci];
          var tagName = colorEl.tagName.replace("a:", "");
          var srgb = colorEl.getElementsByTagName("a:srgbClr")[0];
          if (srgb) {
            colorMap[tagName] = srgb.getAttribute("val");
          }
          // Some colors use sysClr (system color)
          var sysClr = colorEl.getElementsByTagName("a:sysClr")[0];
          if (sysClr) {
            colorMap[tagName] = sysClr.getAttribute("lastClr");
          }
        }
        // Map theme roles to PDF theme
        // dk1 → body text color only (not heading/title, which come from style definitions)
        if (colorMap["dk1"]) {
          var rgb = hexToRgbWord(colorMap["dk1"]);
          if (rgb) { theme.colors.body = rgb; }
        }
        // lt1 → cover background (usually white)
        if (colorMap["lt1"]) {
          var rgb = hexToRgbWord(colorMap["lt1"]);
          if (rgb) { theme.colors.coverBg = rgb; }
        }
        // accent1 → primary, accentBarColor, headerLine, sectionDivider
        var accent1Rgb = null;
        if (colorMap["accent1"]) {
          accent1Rgb = hexToRgbWord(colorMap["accent1"]);
          if (accent1Rgb) {
            theme.colors.primary = accent1Rgb;
            theme.decorations.accentBarColor = accent1Rgb;
            theme.colors.headerLine = accent1Rgb;
            // sectionDivider: lighter version of accent1
            theme.colors.sectionDivider = [
              Math.min(255, Math.round(accent1Rgb[0] * 0.3 + 200)),
              Math.min(255, Math.round(accent1Rgb[1] * 0.3 + 200)),
              Math.min(255, Math.round(accent1Rgb[2] * 0.3 + 200))
            ];
          }
        }
        // accent2 → accent color
        if (colorMap["accent2"]) {
          var rgb = hexToRgbWord(colorMap["accent2"]);
          if (rgb) { theme.colors.accent = rgb; }
        } else if (accent1Rgb) {
          theme.colors.accent = accent1Rgb;
        }
        // heading: use explicit heading color from styles if available, else accent1, else dk2
        // Check if heading was set from Heading1 style (non-default professional value)
        var defaultProfessionalHeadingColor = [31, 35, 40];
        var headingColorNotCustomized = theme.colors.heading &&
          theme.colors.heading[0] === defaultProfessionalHeadingColor[0] &&
          theme.colors.heading[1] === defaultProfessionalHeadingColor[1] &&
          theme.colors.heading[2] === defaultProfessionalHeadingColor[2];
        if (headingColorNotCustomized) {
          // No explicit heading color from styles.xml, use accent1 or dk2
          if (accent1Rgb) {
            theme.colors.heading = accent1Rgb;
            theme.colors.title = accent1Rgb;
          } else if (colorMap["dk2"]) {
            var rgb = hexToRgbWord(colorMap["dk2"]);
            if (rgb) { theme.colors.heading = rgb; theme.colors.title = rgb; }
          }
        }
        // muted: lighter version of body color
        if (theme.colors.body) {
          var b = theme.colors.body;
          theme.colors.muted = [
            Math.min(255, Math.round(b[0] * 0.5 + 128)),
            Math.min(255, Math.round(b[1] * 0.5 + 128)),
            Math.min(255, Math.round(b[2] * 0.5 + 128))
          ];
        }
        if (colorMap["hyperlink"]) {
          var rgb = hexToRgbWord(colorMap["hyperlink"]);
          if (rgb) { theme.colors.primary = rgb; theme.decorations.accentBarColor = rgb; }
        }
      }

      // Parse font scheme from <a:fontScheme>
      var fontSchemes = themeDoc.getElementsByTagName("a:fontScheme");
      if (fontSchemes.length > 0) {
        var fontScheme = fontSchemes[0];
        // Major font (headings)
        var majorLatinEls = fontScheme.getElementsByTagName("a:latin");
        if (majorLatinEls.length > 0) {
          var majorFont = majorLatinEls[0].getAttribute("typeface");
          var mapped = mapWordFont(majorFont);
          if (mapped) theme.fonts.heading = mapped;
        }
        // Minor font (body) — second latin element in fontScheme
        if (majorLatinEls.length > 1) {
          var minorFont = majorLatinEls[1].getAttribute("typeface");
          var mapped = mapWordFont(minorFont);
          if (mapped) theme.fonts.body = mapped;
        }
        // Update extractedInfo if available
        if (theme.extractedInfo) {
          if (majorLatinEls.length > 0) {
            theme.extractedInfo.headingFont = majorLatinEls[0].getAttribute("typeface") || theme.extractedInfo.headingFont;
          }
          if (majorLatinEls.length > 1) {
            theme.extractedInfo.bodyFont = majorLatinEls[1].getAttribute("typeface") || theme.extractedInfo.bodyFont;
          }
        }
      }

      return theme;
    }

    function formatText(type) {
      var ed = document.getElementById("summary-editor");
      if (!ed) return;
      ed.focus();

      switch (type) {
        case "bold": document.execCommand("bold"); break;
        case "italic": document.execCommand("italic"); break;
        case "underline": document.execCommand("underline"); break;
        case "strikethrough": document.execCommand("strikethrough"); break;
        case "heading":
          var sel = window.getSelection();
          if (sel.rangeCount) {
            var text = sel.toString();
            document.execCommand("insertHTML", false, "<h3>" + escapeHtml(text || "Heading") + "</h3>");
          }
          break;
        case "bullet": document.execCommand("insertUnorderedList"); break;
        case "numbered": document.execCommand("insertOrderedList"); break;
        case "hr": document.execCommand("insertHTML", false, "<hr>"); break;
      }

      db.summary = ed.innerHTML;
      saveDB();
    }

    function updateWordCount() {
      var ed = document.getElementById("summary-editor");
      var wc = document.getElementById("summary-word-count");
      if (!ed || !wc) return;
      var text = ed.innerText || "";
      var words = text.trim().split(/\s+/).filter(function(w) { return w.length > 0; });
      wc.textContent = words.length + " words · " + text.length + " characters";
    }

    // ===== JOBS =====
    function createNewJob() {
      showModal("New Job Section", "Give this job a name", "", false, function(name) {
        if (!name) return;
        showModal("System Prompt", "Sets the AI's role. Sent with every message.", "You are a helpful assistant.", true, function(sp) {
          var job = {
            id: Date.now().toString(), name: name, color: TAB_COLORS[db.jobs.length % TAB_COLORS.length],
            messages: [{ role: "system", content: sp || "You are a helpful assistant." }], notes: ""
          };
          db.jobs.push(job); db.activeJobId = job.id; db.activeView = "job"; saveDB(); renderSidebar(); renderView();
        });
      });
    }
    function switchJob(id) { saveCurrentNotes(); db.activeJobId = id; db.activeView = "job"; saveDB(); renderSidebar(); renderView(); }
    function renameJob(id) {
      var j = getJob(id); if (!j) return;
      showModal("Rename Job", "", j.name, false, function(n) { if (!n) return; j.name = n; saveDB(); renderSidebar(); renderView(); });
    }
    function deleteJob(id) {
      if (!confirm("Delete this job section?")) return;
      db.jobs = db.jobs.filter(function(j) { return j.id !== id; });
      if (db.activeJobId === id) { db.activeJobId = db.jobs.length ? db.jobs[0].id : null; if (!db.activeJobId) db.activeView = "summary"; }
      saveDB(); renderSidebar(); renderView();
    }
    function editSystemPrompt() {
      if (!db.activeJobId) return; var j = getJob(db.activeJobId); if (!j) return;
      showModal("Edit System Prompt", "Sent with every message.", j.messages[0].content, true, function(v) {
        j.messages[0].content = v || "You are a helpful assistant."; saveDB(); updateContextBar();
      });
    }

    function deleteExchange(jobId, msgIndex) {
      var job = getJob(jobId);
      if (!job) return;

      // msgIndex is the index in conversation (0-based, excluding system)
      // actual index in job.messages = msgIndex + 1
      var actualIndex = msgIndex + 1;
      var msg = job.messages[actualIndex];
      if (!msg) return;

      if (msg.role === "assistant") {
        // Delete the assistant reply AND the user question before it
        var prevIndex = actualIndex - 1;
        if (prevIndex >= 1 && job.messages[prevIndex].role === "user") {
          if (!confirm("Delete this exchange (your question + the assistant reply)?")) return;
          job.messages.splice(prevIndex, 2); // remove both
        } else {
          if (!confirm("Delete this assistant reply?")) return;
          job.messages.splice(actualIndex, 1);
        }
      } else {
        if (!confirm("Delete this message?")) return;
        job.messages.splice(actualIndex, 1);
      }

      saveDB();
      renderView();
    }

    function saveCurrentNotes() {
      if (!db.activeJobId) return;
      var ed = document.getElementById("notes-editor");
      if (ed) { var j = getJob(db.activeJobId); if (j) { j.notes = ed.value; saveDB(); } }
    }

    // ===== CONTEXT BAR =====
    function updateContextBar() {
      var bar = document.getElementById("context-bar"), txt = document.getElementById("context-bar-text");
      if (!db.activeJobId || db.activeView !== "job") { bar.classList.remove("visible"); return; }
      var j = getJob(db.activeJobId); if (!j) { bar.classList.remove("visible"); return; }
      var te = Math.floor((j.messages.length - 1) / 2), conv = j.messages.slice(1);
      var docCount = j.messages.filter(function(m) { return m.isDocument; }).length;
      var trimmed = conv.length > (KEEP_FIRST + KEEP_LAST) * 2;
      var sp = j.messages[0].content.substring(0, 80); if (j.messages[0].content.length > 80) sp += "…";
      var info = '🧠 "' + sp + '" | 💬 ' + te + ' exchanges';
      if (docCount > 0) info += ' | 📎 ' + docCount + ' document' + (docCount !== 1 ? 's' : '') + ' attached';
      if (trimmed) { var sk = Math.floor((conv.length - (KEEP_FIRST + KEEP_LAST) * 2) / 2); info += ' | ✂️ First ' + KEEP_FIRST + ' + Last ' + KEEP_LAST + ' (' + sk + ' skipped)'; }
      else info += ' | ✅ Full history sent';
      txt.textContent = info; bar.classList.add("visible");
    }

    // ===== RENDER =====
    function renderView() { if (db.activeView === "summary" || !db.activeJobId) renderSummaryPage(); else renderActiveJob(); }

    function renderSidebar() {
      document.getElementById("summary-tab").className = (db.activeView === "summary" || !db.activeJobId) ? "active" : "";
      document.getElementById("summary-tab-name").textContent = db.summaryTitle;
      var list = document.getElementById("job-list"); list.innerHTML = "";
      db.jobs.forEach(function(job) {
        var mc = Math.floor((job.messages.length - 1) / 2);
        var tab = document.createElement("div");
        tab.className = "job-tab" + (job.id === db.activeJobId && db.activeView === "job" ? " active" : "");
        tab.innerHTML =
          '<span class="job-color-dot" style="background:' + job.color + '"></span>' +
          '<span class="job-tab-name">' + escapeHtml(job.name) + '</span>' +
          '<span class="job-tab-info">' + mc + '</span>' +
          '<span class="job-tab-actions">' +
            '<button class="job-tab-btn" title="Rename" data-action="rename" data-id="' + job.id + '">✏️</button>' +
            '<button class="job-tab-btn delete" title="Delete" data-action="delete" data-id="' + job.id + '">🗑️</button></span>';
        tab.addEventListener("click", function(e) {
          if (e.target.dataset.action === "rename") { renameJob(e.target.dataset.id); return; }
          if (e.target.dataset.action === "delete") { deleteJob(e.target.dataset.id); return; }
          switchJob(job.id);
        });
        list.appendChild(tab);
      });
    }

    function renderActiveJob() {
      var ca = document.getElementById("content-area"), tl = document.getElementById("current-job-title");
      if (!db.activeJobId) { renderSummaryPage(); return; }
      var job = getJob(db.activeJobId); if (!job) return;
      tl.textContent = job.name;

      ca.innerHTML =
        '<div id="chat-panel"><div id="chat"></div>' +
        '<div id="input-section">' +
        '<div class="input-attach-group">' +
        '<button class="input-attach-btn" id="upload-btn" onclick="document.getElementById(\'doc-upload-file\').click()" title="Upload Document">📎</button>' +
        '<button class="input-attach-btn" id="manual-content-btn" onclick="openManualContentModal()" title="Add Content">📋</button>' +
        '<button class="input-attach-btn" id="image-btn" onclick="openImagePicker()" title="Add Screenshot">📷</button>' +
        '</div>' +
        '<input type="text" id="userInput" placeholder="Ask a question..." />' +
        '<button onclick="sendMessage()" id="sendBtn">Send</button></div></div>' +
        '<div id="notes-panel"><div id="notes-header"><span>📋 Notes / Clipboard</span>' +
        '<button onclick="clearNotes()">Clear</button></div>' +
        '<div id="notes-content"><textarea id="notes-editor" placeholder="Paste or type notes here..."></textarea></div></div>';

      var chatDiv = document.getElementById("chat"), conv = job.messages.slice(1);
      var fc = KEEP_FIRST * 2, lc = KEEP_LAST * 2, trim = conv.length > fc + lc;
      conv.forEach(function(msg, i) {
        var inCtx = !trim || (i < fc) || (i >= conv.length - lc);
        addMessageToDOM(msg.role, msg.content, !inCtx, i);
        if (trim && i === fc - 1) {
          var d = document.createElement("div"); d.className = "trimmed-divider";
          d.textContent = "✂️ " + (conv.length - fc - lc) + " messages not sent to AI";
          chatDiv.appendChild(d);
        }
      });

      document.getElementById("notes-editor").value = job.notes || "";
      document.getElementById("notes-editor").addEventListener("input", function() { job.notes = this.value; saveDB(); });
      document.getElementById("userInput").addEventListener("keydown", function(e) { if (e.key === "Enter") sendMessage(); });
      document.getElementById("userInput").focus();
      updateContextBar();
    }

    function enterEditMode(jobId, convIdx, msgDiv, bodyEl, editBtnEl) {
      var job = getJob(jobId); if (!job) return;
      var actualIndex = convIdx + 1;
      var msg = job.messages[actualIndex]; if (!msg) return;

      bodyEl.style.display = "none";
      editBtnEl.disabled = true;

      var ta = document.createElement("textarea");
      ta.className = "msg-edit-textarea";
      ta.value = msg.content;

      var saveBtn = document.createElement("button");
      saveBtn.className = "msg-save-btn"; saveBtn.textContent = "💾 Save";

      var cancelBtn = document.createElement("button");
      cancelBtn.className = "msg-cancel-btn"; cancelBtn.textContent = "❌ Cancel";

      var btnRow = document.createElement("div"); btnRow.className = "msg-edit-btns";
      btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);

      var editArea = document.createElement("div"); editArea.className = "msg-edit-area";
      editArea.appendChild(ta); editArea.appendChild(btnRow);
      msgDiv.appendChild(editArea);
      ta.focus();

      saveBtn.onclick = function() {
        var newContent = ta.value;
        msg.content = newContent;
        saveDB();
        if (msg.role === "assistant") { bodyEl.innerHTML = marked.parse(newContent); addCopyButtons(bodyEl); }
        else { bodyEl.textContent = newContent; }
        bodyEl.style.display = "";
        editBtnEl.disabled = false;
        msgDiv.removeChild(editArea);
      };
      cancelBtn.onclick = function() {
        bodyEl.style.display = "";
        editBtnEl.disabled = false;
        msgDiv.removeChild(editArea);
      };
    }

    function toggleLock(jobId, convIdx) {
      var job = getJob(jobId); if (!job) return;
      var actualIndex = convIdx + 1;
      var msg = job.messages[actualIndex]; if (!msg) return;
      msg.locked = !msg.locked;
      saveDB();
      renderView();
    }

    function moveExchange(jobId, convIdx, dir) {
      // job.messages layout: [0:system, 1:user, 2:asst, 3:user, 4:asst, ...]
      // actualIndex is the assistant; actualIndex-1 is its paired user message
      var job = getJob(jobId); if (!job) return;
      var actualIndex = convIdx + 1; // assistant message index
      if (dir === "up") {
        // Previous exchange starts 3 positions back (prev-user, prev-asst, cur-user, cur-asst)
        var prevUserIdx = actualIndex - 3;
        if (prevUserIdx < 1) return; // already the first exchange
        var exchange = job.messages.splice(actualIndex - 1, 2);
        job.messages.splice(prevUserIdx, 0, exchange[0], exchange[1]);
      } else {
        // Next exchange: user at actualIndex+1, assistant at actualIndex+2
        var nextUserIdx = actualIndex + 1;
        if (nextUserIdx + 1 >= job.messages.length) return; // already the last exchange
        var nextExchange = job.messages.splice(nextUserIdx, 2);
        job.messages.splice(actualIndex - 1, 0, nextExchange[0], nextExchange[1]);
      }
      saveDB();
      renderView();
    }

    function addMessageToDOM(role, content, isTrimmed, idx) {
      var chatDiv = document.getElementById("chat"); if (!chatDiv) return;
      var job = getJob(db.activeJobId);
      var actualIndex = idx + 1;
      var msg = job ? job.messages[actualIndex] : null;
      var locked = msg ? !!msg.locked : false;

      var msgDiv = document.createElement("div");
      msgDiv.className = "message message-" + role + (isTrimmed ? " message-trimmed" : "") + (locked && role === "assistant" ? " message-locked" : "");
      var label = document.createElement("div"); label.className = "message-label";
      var lt = document.createElement("span");
      lt.textContent = (role === "user" ? "You" : role === "assistant" ? "Assistant" : "Error") +
        (isTrimmed ? " (not in context)" : "") + (locked && role === "assistant" ? " 🔒" : "");
      var actions = document.createElement("span"); actions.className = "msg-actions";

      var editBtnRef = null;

      if (role === "assistant") {
        var muBtn = document.createElement("button"); muBtn.className = "msg-move-btn"; muBtn.textContent = "⬆️ Up";
        muBtn.disabled = !(job && actualIndex - 3 >= 1); // disabled if no previous exchange
        (function(i) { muBtn.onclick = function() { moveExchange(db.activeJobId, i, "up"); }; })(idx);
        actions.appendChild(muBtn);

        var mdBtn = document.createElement("button"); mdBtn.className = "msg-move-btn"; mdBtn.textContent = "⬇️ Down";
        mdBtn.disabled = !(job && actualIndex + 2 < job.messages.length); // disabled if no next exchange
        (function(i) { mdBtn.onclick = function() { moveExchange(db.activeJobId, i, "down"); }; })(idx);
        actions.appendChild(mdBtn);

        var editBtn = document.createElement("button"); editBtn.className = "msg-edit-btn"; editBtn.textContent = "✏️ Edit";
        if (locked) editBtn.disabled = true;
        editBtnRef = editBtn;
        actions.appendChild(editBtn);

        var lockBtn = document.createElement("button"); lockBtn.className = "msg-lock-btn";
        lockBtn.textContent = locked ? "🔓 Unlock" : "🔒 Lock";
        (function(i) { lockBtn.onclick = function() { toggleLock(db.activeJobId, i); }; })(idx);
        actions.appendChild(lockBtn);

        var cb = document.createElement("button"); cb.className = "msg-copy-btn"; cb.textContent = "📄 Copy";
        (function(i) {
          cb.onclick = function() {
            var j = getJob(db.activeJobId);
            var c = j && j.messages[i + 1] ? j.messages[i + 1].content : content;
            navigator.clipboard.writeText(c);
            cb.textContent = "✅ Copied!"; setTimeout(function() { cb.textContent = "📄 Copy"; }, 2000);
          };
        })(idx);
        actions.appendChild(cb);

        var pb = document.createElement("button"); pb.className = "paste-to-notes-btn"; pb.textContent = "📋 To Notes";
        (function(i) {
          pb.onclick = function() {
            var ed = document.getElementById("notes-editor"); if (ed) {
              var j = getJob(db.activeJobId);
              var c = j && j.messages[i + 1] ? j.messages[i + 1].content : content;
              ed.value += (ed.value ? "\n\n---\n\n" : "") + c;
              if (j) { j.notes = ed.value; saveDB(); }
              pb.textContent = "✅ Pasted!"; setTimeout(function() { pb.textContent = "📋 To Notes"; }, 2000);
            }
          };
        })(idx);
        actions.appendChild(pb);

        var del = document.createElement("button"); del.className = "msg-delete-btn"; del.textContent = "🗑️ Delete";
        if (locked) del.disabled = true;
        (function(i) { del.onclick = function() { deleteExchange(db.activeJobId, i); }; })(idx);
        actions.appendChild(del);

      } else if (role === "user") {
        var uEditBtn = document.createElement("button"); uEditBtn.className = "msg-edit-btn"; uEditBtn.textContent = "✏️ Edit";
        editBtnRef = uEditBtn;
        actions.appendChild(uEditBtn);

        var uDel = document.createElement("button"); uDel.className = "msg-delete-btn"; uDel.textContent = "🗑️ Delete";
        (function(i) { uDel.onclick = function() { deleteExchange(db.activeJobId, i); }; })(idx);
        actions.appendChild(uDel);
      }

      label.appendChild(lt); label.appendChild(actions);
      var body = document.createElement("div"); body.className = "message-body";

      if (role === "user") {
        if (msg && msg.isDocument) {
          msgDiv.classList.add("message-document");
          var indicator = document.createElement("div");
          indicator.className = "document-indicator";
          indicator.textContent = "📎 Document attached: \"" + msg.documentName + "\"" + (msg.documentInfo ? " (" + msg.documentInfo + ")" : "");
          body.appendChild(indicator);
          var toggleBtn = document.createElement("button");
          toggleBtn.className = "document-toggle-btn";
          toggleBtn.textContent = "👁️ View Content";
          toggleBtn.setAttribute("aria-expanded", "false");
          var contentDiv = document.createElement("div");
          contentDiv.className = "document-content";
          contentDiv.setAttribute("role", "region");
          contentDiv.setAttribute("aria-label", "Document content for " + msg.documentName);
          contentDiv.textContent = content;
          (function(tb, cd) {
            tb.onclick = function() {
              cd.classList.toggle("visible");
              var expanded = cd.classList.contains("visible");
              tb.setAttribute("aria-expanded", expanded ? "true" : "false");
              tb.textContent = expanded ? "🔼 Hide Content" : "👁️ View Content";
            };
          })(toggleBtn, contentDiv);
          body.appendChild(toggleBtn);
          body.appendChild(contentDiv);
          if (editBtnRef) { editBtnRef.disabled = true; editBtnRef.title = "Document messages cannot be edited"; }
        } else if (msg && msg.isManualContent) {
          msgDiv.classList.add("message-manual-content");
          var mcIndicator = document.createElement("div");
          mcIndicator.className = "manual-content-indicator";
          mcIndicator.textContent = "📋 Manual content: \"" + msg.contentTitle + "\" (" + msg.contentType + (msg.contentInfo ? ", " + msg.contentInfo : "") + ")";
          body.appendChild(mcIndicator);
          var mcToggleBtn = document.createElement("button");
          mcToggleBtn.className = "manual-content-toggle-btn";
          mcToggleBtn.textContent = "👁️ View Content";
          var isTerminal = ["Command Output", "Log Output", "Code", "Error Message"].indexOf(msg.contentType) !== -1;
          var mcContentDiv = document.createElement("div");
          mcContentDiv.className = "manual-content-display " + (isTerminal ? "manual-content-terminal" : "manual-content-text");
          var rawContent = content;
          var headerEnd = rawContent.indexOf(":\n\n");
          if (headerEnd !== -1) rawContent = rawContent.substring(headerEnd + 3);
          mcContentDiv.textContent = rawContent;
          (function(tb, cd) {
            tb.onclick = function() {
              cd.classList.toggle("visible");
              tb.textContent = cd.classList.contains("visible") ? "🔼 Hide Content" : "👁️ View Content";
            };
          })(mcToggleBtn, mcContentDiv);
          body.appendChild(mcToggleBtn);
          body.appendChild(mcContentDiv);
          if (editBtnRef) { editBtnRef.disabled = true; editBtnRef.title = "Manual content messages cannot be edited"; }
        } else if (msg && msg.isImage) {
          msgDiv.classList.add("message-image");
          var imgIndicator = document.createElement("div");
          imgIndicator.className = "image-indicator";
          imgIndicator.textContent = "🖼️ Image attached: \"" + msg.imageName + "\"" + (msg.imageInfo ? " (" + msg.imageInfo + ")" : "");
          body.appendChild(imgIndicator);
          var imgToggleBtn = document.createElement("button");
          imgToggleBtn.className = "image-toggle-btn";
          imgToggleBtn.textContent = "👁️ View Image";
          var imgEl = document.createElement("img");
          imgEl.className = "image-preview";
          imgEl.src = msg.imageData;
          imgEl.alt = msg.imageName;
          (function(im) {
            im.onclick = function() { window.open(im.src, "_blank"); };
          })(imgEl);
          (function(tb, im) {
            tb.onclick = function() {
              im.classList.toggle("visible");
              tb.textContent = im.classList.contains("visible") ? "🔼 Hide Image" : "👁️ View Image";
            };
          })(imgToggleBtn, imgEl);
          body.appendChild(imgToggleBtn);
          body.appendChild(imgEl);
          if (editBtnRef) { editBtnRef.disabled = true; editBtnRef.title = "Image messages cannot be edited"; }
        } else {
          body.textContent = content;
          if (editBtnRef) {
            (function(i, eb, bd) {
              eb.onclick = function() { enterEditMode(db.activeJobId, i, msgDiv, bd, eb); };
            })(idx, editBtnRef, body);
          }
        }
      } else if (role === "assistant") {
        body.innerHTML = marked.parse(content);
        addCopyButtons(body);
        if (editBtnRef) {
          (function(i, eb, bd) {
            eb.onclick = function() { enterEditMode(db.activeJobId, i, msgDiv, bd, eb); };
          })(idx, editBtnRef, body);
        }
      }

      msgDiv.appendChild(label); msgDiv.appendChild(body); chatDiv.appendChild(msgDiv); chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    function addCopyButtons(c) {
      c.querySelectorAll("pre").forEach(function(pre) {
        var w = document.createElement("div"); w.className = "code-wrapper"; pre.parentNode.insertBefore(w, pre); w.appendChild(pre);
        var b = document.createElement("button"); b.className = "copy-btn"; b.textContent = "Copy";
        b.onclick = function() { var code = pre.querySelector("code"); navigator.clipboard.writeText(code ? code.textContent : pre.textContent); b.textContent = "Copied!"; setTimeout(function() { b.textContent = "Copy"; }, 2000); };
        w.appendChild(b);
      });
    }

    function clearNotes() {
      if (!confirm("Clear all notes?")) return; var ed = document.getElementById("notes-editor"); if (ed) ed.value = "";
      var j = getJob(db.activeJobId); if (j) { j.notes = ""; saveDB(); }
    }

    // ===== CHAT =====
    function showTyping() { var c = document.getElementById("chat"); if (!c) return; var m = document.createElement("div"); m.className = "message message-assistant"; m.id = "typing-indicator"; m.innerHTML = '<div class="message-label"><span>Assistant</span></div><div><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>'; c.appendChild(m); c.scrollTop = c.scrollHeight; }
    function removeTyping() { var e = document.getElementById("typing-indicator"); if (e) e.remove(); }

    async function sendMessage() {
      if (!db.activeJobId) return; var job = getJob(db.activeJobId); if (!job) return;
      var input = document.getElementById("userInput"), ut = input.value.trim();
      var activeToken = activeProvider === "github" ? token : (activeProvider === "openai" ? openaiToken : anthropicToken);
      if (!ut || !activeToken) {
        if (!activeToken) {
          var label = activeProvider === "github" ? "GitHub token" : (activeProvider === "openai" ? "OpenAI API key" : "Anthropic API key");
          alert("Please save your " + label + " first.");
        }
        return;
      }

      addMessageToDOM("user", ut, false, job.messages.length - 1);
      job.messages.push({ role: "user", content: ut }); saveDB();
      input.value = ""; input.disabled = true; document.getElementById("sendBtn").disabled = true;
      showTyping();

      try {
        var ctx = buildContextMessages(job.messages);
        var r, d, reply;

        if (activeProvider === "anthropic") {
          var sysMsg = ctx[0];
          var convMsgs = ctx.slice(1).filter(function(m) {
            return m.role === "user" || m.role === "assistant" || m.role === "developer";
          }).map(function(m) {
            return { role: m.role === "developer" ? "user" : m.role, content: m.content };
          });
          var systemContent = (sysMsg && sysMsg.content) || "";
          r = await fetch(ANTHROPIC_DIRECT_URL, {
            method: "POST",
            headers: {
              "x-api-key": anthropicToken,
              "Content-Type": "application/json",
              "anthropic-version": "2023-06-01",
              "anthropic-dangerous-direct-browser-access": "true"
            },
            body: JSON.stringify({ model: selectedModel, max_tokens: 4096, system: systemContent, messages: convMsgs })
          });
          removeTyping();
          if (!r.ok) { var et = await r.text(); addMessageToDOM("error", "Error " + r.status + ": " + et, false); job.messages.pop(); saveDB(); }
          else {
            d = await r.json();
            reply = (d.content && d.content[0] && d.content[0].text) || "No response.";
            job.messages.push({ role: "assistant", content: reply }); saveDB();
            addMessageToDOM("assistant", reply, false, job.messages.length - 2);
          }
        } else {
          var endpoint = activeProvider === "openai" ? OPENAI_DIRECT_URL : API_URL;
          var authToken = activeProvider === "openai" ? openaiToken : token;
          r = await fetch(endpoint, {
            method: "POST",
            headers: { "Authorization": "Bearer " + authToken, "Content-Type": "application/json" },
            body: JSON.stringify({ model: selectedModel, messages: ctx })
          });
          removeTyping();
          if (!r.ok) { var et = await r.text(); addMessageToDOM("error", "Error " + r.status + ": " + et, false); job.messages.pop(); saveDB(); }
          else {
            d = await r.json();
            reply = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || "No response.";
            job.messages.push({ role: "assistant", content: reply }); saveDB();
            addMessageToDOM("assistant", reply, false, job.messages.length - 2);
          }
        }
      } catch (err) { removeTyping(); addMessageToDOM("error", err.message, false); job.messages.pop(); saveDB(); }

      input.disabled = false; document.getElementById("sendBtn").disabled = false; input.focus();
      updateContextBar(); renderSidebar();
    }

    // ===== EXPORT =====
    async function exportData() {
      saveCurrentNotes();
      var se = document.getElementById("summary-editor"); if (se) db.summary = se.innerHTML;
      var json = JSON.stringify(db, null, 2);
      var defName = "github-chat-" + new Date().toISOString().slice(0, 10) + ".json";

      if (window.showSaveFilePicker) {
        try {
          var handle = await window.showSaveFilePicker({ suggestedName: defName, types: [{ description: "JSON Files", accept: { "application/json": [".json"] } }] });
          var w = await handle.createWritable(); await w.write(json); await w.close(); return;
        } catch (err) { if (err.name === "AbortError") return; }
      }
      var blob = new Blob([json], { type: "application/json" }); var url = URL.createObjectURL(blob);
      var a = document.createElement("a"); a.href = url; a.download = defName; a.click(); URL.revokeObjectURL(url);
    }

    function importData() { document.getElementById("import-file").click(); }
    function handleImport(event) {
      var file = event.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        try {
          var imp = JSON.parse(e.target.result);
          if (!imp.jobs || !Array.isArray(imp.jobs)) { alert("Invalid format."); return; }
          if (confirm("Replace all current data?")) {
            db = imp;
            if (!db.summary) db.summary = "";
            if (!db.activeView) db.activeView = "summary";
            if (!db.summaryTitle) db.summaryTitle = "Document Summary";
            if (!db.summaryStyle) db.summaryStyle = { fontFamily: "sans-serif", fontSize: 16, textColor: "#1f2328", bgColor: "#ffffff" };
            saveDB(); renderSidebar(); renderView();
          }
        } catch (err) { alert("Failed to parse: " + err.message); }
      };
      reader.readAsText(file); event.target.value = "";
    }

    var MAX_DOC_CHARS = 50000;

    function handleDocumentUpload(event) {
      var file = event.target.files[0];
      event.target.value = "";
      if (!file) return;

      if (!db.activeJobId) return;
      var job = getJob(db.activeJobId); if (!job) return;

      var uploadBtn = document.getElementById("upload-btn");
      if (uploadBtn) uploadBtn.textContent = "⏳";

      var filename = file.name;
      var ext = filename.split(".").pop().toLowerCase();
      var reader = new FileReader();

      reader.onload = function(e) {
        var buffer = e.target.result;
        try {
          var extractedText = "";
          var documentInfo = "";

          if (ext === "xlsx" || ext === "xls" || ext === "csv") {
            var workbook = XLSX.read(buffer, { type: "array" });
            var parts = ['📊 Uploaded spreadsheet: "' + filename + '"'];
            var sheetCount = workbook.SheetNames.length, totalRows = 0;
            workbook.SheetNames.forEach(function(sheetName) {
              var sheet = workbook.Sheets[sheetName];
              var csv = XLSX.utils.sheet_to_csv(sheet);
              var rows = 0, cols = 0;
              if (sheet["!ref"]) {
                var range = XLSX.utils.decode_range(sheet["!ref"]);
                rows = range.e.r - range.s.r + 1;
                cols = range.e.c - range.s.c + 1;
              }
              totalRows += rows;
              parts.push("\n--- Sheet: " + sheetName + " (" + rows + " rows × " + cols + " columns) ---\n" + csv);
            });
            extractedText = parts.join("\n");
            documentInfo = sheetCount + " sheet" + (sheetCount !== 1 ? "s" : "") + ", " + totalRows.toLocaleString() + " rows";
          } else if (ext === "docx") {
            mammoth.extractRawText({ arrayBuffer: buffer }).then(function(result) {
              var text = result.value;
              var wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
              var docInfo = wordCount.toLocaleString() + " words";
              var header = '📄 Uploaded document: "' + filename + '"';
              var fullText = header + "\n\n" + text;
              if (fullText.length > MAX_DOC_CHARS) {
                var origLen = fullText.length;
                fullText = fullText.substring(0, MAX_DOC_CHARS) +
                  "\n[Content truncated at 50,000 characters. The full document contained approximately " + origLen + " characters.]";
              }
              injectDocumentMessage(job, filename, fullText, docInfo);
              if (uploadBtn) uploadBtn.textContent = "📎";
            }).catch(function(err) {
              injectDocumentError(job, filename, err.message);
              if (uploadBtn) uploadBtn.textContent = "📎";
            });
            return; // async path handled above
          } else {
            if (uploadBtn) uploadBtn.textContent = "📎";
            return;
          }

          if (extractedText.length > MAX_DOC_CHARS) {
            var fullLen = extractedText.length;
            extractedText = extractedText.substring(0, MAX_DOC_CHARS) +
              "\n[Content truncated at 50,000 characters. The full document contained approximately " + fullLen + " characters.]";
          }
          injectDocumentMessage(job, filename, extractedText, documentInfo);
          if (uploadBtn) uploadBtn.textContent = "📎";
        } catch (err) {
          injectDocumentError(job, filename, err.message);
          if (uploadBtn) uploadBtn.textContent = "📎";
        }
      };

      reader.onerror = function() {
        injectDocumentError(job, filename, "Failed to read file.");
        if (uploadBtn) uploadBtn.textContent = "📎";
      };

      reader.readAsArrayBuffer(file);
    }

    function injectDocumentMessage(job, filename, extractedText, documentInfo) {
      var contentMessage = "I've uploaded a file called '" + filename + "'. Please analyze it.\n\n" + extractedText;
      job.messages.push({ role: "user", content: contentMessage, isDocument: true, documentName: filename, documentInfo: documentInfo || "" });
      saveDB();
      addMessageToDOM("user", contentMessage, false, job.messages.length - 2);
      updateContextBar();
      var chat = document.getElementById("chat");
      if (chat) chat.scrollTop = chat.scrollHeight;
    }

    function injectDocumentError(job, filename, errMsg) {
      var msg = "❌ Failed to parse \"" + filename + "\": " + errMsg;
      addMessageToDOM("error", msg, false, -1);
      var chat = document.getElementById("chat");
      if (chat) chat.scrollTop = chat.scrollHeight;
    }

    // ===== MANUAL CONTENT =====
    function openManualContentModal() {
      if (!db.activeJobId) { alert("Please select or create a job first."); return; }
      var ov = document.createElement("div");
      ov.className = "modal-overlay manual-content-modal";
      ov.innerHTML =
        '<div class="modal" style="width:520px">' +
        '<h3>📋 Add Content</h3>' +
        '<label for="mc-title">Content Title</label>' +
        '<input type="text" id="mc-title" placeholder="e.g. Server Logs, Error Output, Config File" />' +
        '<label for="mc-type">Content Type</label>' +
        '<select id="mc-type" style="width:100%;padding:0.5rem;border:1px solid #d0d7de;border-radius:6px;font-size:0.95rem;margin-bottom:0.75rem;font-family:inherit;box-sizing:border-box">' +
        '<option>Command Output</option><option>Log Output</option><option>Code</option>' +
        '<option>Error Message</option><option>Plain Text</option><option>Other</option>' +
        '</select>' +
        '<label for="mc-content">Content</label>' +
        '<textarea id="mc-content" style="width:100%;height:200px;padding:0.5rem;border:1px solid #d0d7de;border-radius:6px;font-size:0.88rem;font-family:\'SFMono-Regular\',Consolas,\'Liberation Mono\',Menlo,monospace;resize:vertical;box-sizing:border-box;margin-bottom:1rem" placeholder="Paste your content here..."></textarea>' +
        '<div class="modal-btns"><button class="cancel" id="mc-cancel">Cancel</button><button class="confirm" id="mc-ok">Add Content</button></div>' +
        '</div>';
      document.body.appendChild(ov);
      var titleInput = document.getElementById("mc-title");
      titleInput.focus();
      document.getElementById("mc-cancel").onclick = function() { document.body.removeChild(ov); };
      document.getElementById("mc-ok").onclick = function() {
        var title = titleInput.value.trim() || "Untitled";
        var type = document.getElementById("mc-type").value;
        var content = document.getElementById("mc-content").value;
        if (!content.trim()) { alert("Please paste some content."); return; }
        document.body.removeChild(ov);
        handleManualContent(title, type, content);
      };
    }

    function handleManualContent(title, type, content) {
      if (!db.activeJobId) return;
      var job = getJob(db.activeJobId); if (!job) return;
      var lineCount = content.split("\n").length;
      var contentInfo = lineCount + " line" + (lineCount !== 1 ? "s" : "");
      var fullContent = "Manual content titled '" + title + "' (" + type + "):\n\n" + content;
      job.messages.push({
        role: "user", content: fullContent,
        isManualContent: true, contentTitle: title, contentType: type, contentInfo: contentInfo
      });
      saveDB();
      addMessageToDOM("user", fullContent, false, job.messages.length - 2);
      updateContextBar();
      var chat = document.getElementById("chat");
      if (chat) chat.scrollTop = chat.scrollHeight;
    }

    // ===== IMAGE HANDLING =====
    function openImagePicker() {
      if (!db.activeJobId) { alert("Please select or create a job first."); return; }
      if (navigator.clipboard && navigator.clipboard.read) {
        navigator.clipboard.read().then(function(items) {
          for (var i = 0; i < items.length; i++) {
            var imageType = items[i].types.find(function(t) { return t.indexOf("image/") === 0; });
            if (imageType) {
              items[i].getType(imageType).then(function(blob) {
                handleImageFile(blob, "clipboard_" + Date.now() + ".png");
              });
              return;
            }
          }
          document.getElementById("image-upload-file").click();
        }).catch(function() {
          document.getElementById("image-upload-file").click();
        });
      } else {
        document.getElementById("image-upload-file").click();
      }
    }

    function handleImageUpload(event) {
      var file = event.target.files[0];
      event.target.value = "";
      if (!file) return;
      handleImageFile(file, file.name);
    }

    function handleImageFile(blob, name) {
      if (!db.activeJobId) return;
      var job = getJob(db.activeJobId); if (!job) return;
      var MAX_WIDTH = 1920;
      var JPEG_QUALITY = 0.85;
      var reader = new FileReader();
      reader.onload = function(e) {
        var dataUrl = e.target.result;
        var img = new Image();
        img.onload = function() {
          var w = img.width, h = img.height;
          var canvas, ctx, finalUrl;
          if (w > MAX_WIDTH) {
            var ratio = MAX_WIDTH / w;
            canvas = document.createElement("canvas");
            canvas.width = MAX_WIDTH; canvas.height = Math.round(h * ratio);
            ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            finalUrl = canvas.toDataURL("image/jpeg", JPEG_QUALITY);
            w = canvas.width; h = canvas.height;
          } else {
            finalUrl = dataUrl;
          }
          // base64 strings are ~4/3 larger than binary; multiply by 0.75 to estimate actual byte size
          var sizeKB = Math.round(finalUrl.length * 0.75 / 1024);
          var imageInfo = w + "×" + h + ", " + sizeKB + " KB";
          var contentText = "I've attached a screenshot/image for analysis.";
          job.messages.push({
            role: "user", content: contentText,
            isImage: true, imageData: finalUrl, imageName: name, imageInfo: imageInfo
          });
          saveDB();
          addMessageToDOM("user", contentText, false, job.messages.length - 2);
          updateContextBar();
          var chat = document.getElementById("chat");
          if (chat) chat.scrollTop = chat.scrollHeight;
        };
        img.src = dataUrl;
      };
      reader.readAsDataURL(blob);
    }

    // ===== CLIPBOARD PASTE SUPPORT =====
    document.addEventListener("paste", function(e) {
      if (!db.activeJobId || db.activeView !== "job") return;
      var items = e.clipboardData && e.clipboardData.items;
      if (!items) return;
      for (var i = 0; i < items.length; i++) {
        if (items[i].type.indexOf("image") !== -1) {
          e.preventDefault();
          var blob = items[i].getAsFile();
          handleImageFile(blob, "clipboard_paste_" + Date.now() + ".png");
          return;
        }
      }
    });

    function escapeHtml(t) { var d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

    // ===== INIT =====
    loadDB(); loadToken(); renderSidebar(); renderView();
    if (activeProvider === "github" && token) setTimeout(fetchModels, 500);
      /* ===== Open all external links in a new tab ===== */
  document.addEventListener('click', function (e) {
    var link = e.target.closest('a[href]');
    if (!link) return;
    var href = link.getAttribute('href');
    // Skip internal hash links (sidebar navigation)
    if (href && href.charAt(0) === '#') return;
    // Open all other links in a new tab
    if (href && (href.startsWith('http://') || href.startsWith('https://'))) {
      e.preventDefault();
      window.open(href, '_blank', 'noopener,noreferrer');
    }
  });
  </script>
