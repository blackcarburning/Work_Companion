<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub Models Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@4.2.0/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #f6f8fa;
      color: #1f2328;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    #sidebar {
      width: 260px;
      min-width: 260px;
      background: #24292f;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid #3d444d;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #sidebar-header h2 { font-size: 1rem; color: #e6edf3; }
    .sidebar-btn {
      padding: 0.5rem 0.75rem;
      border: 1px solid #3d444d;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      color: #e6edf3;
      text-align: center;
    }
    #new-job-btn { background: #2da44e; border-color: #2da44e; }
    #new-job-btn:hover { background: #218838; }
    .sidebar-actions { display: flex; gap: 0.4rem; }
    .sidebar-actions .sidebar-btn { flex: 1; background: #30363d; }
    .sidebar-actions .sidebar-btn:hover { background: #484f58; }

    #summary-tab {
      padding: 0.6rem 0.75rem;
      margin: 0.5rem 0.5rem 0;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      border-left: 4px solid transparent;
      transition: background 0.15s;
      color: #ffa657;
    }
    #summary-tab:hover { background: #30363d; }
    #summary-tab.active { background: #30363d; border-left-color: #ffa657; }
    #summary-tab-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #summary-tab .edit-summary-btn {
      background: none; border: none; color: #8b949e; cursor: pointer;
      font-size: 0.8rem; padding: 0.1rem 0.3rem; border-radius: 3px;
      opacity: 0; transition: opacity 0.15s;
    }
    #summary-tab:hover .edit-summary-btn { opacity: 1; }
    #summary-tab .edit-summary-btn:hover { color: #e6edf3; background: #484f58; }

    #job-list { flex: 1; overflow-y: auto; padding: 0.5rem; }

    .job-tab {
      padding: 0.6rem 0.75rem;
      margin-bottom: 0.3rem;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      border-left: 4px solid transparent;
      transition: background 0.15s;
    }
    .job-tab:hover { background: #30363d; }
    .job-tab.active { background: #30363d; border-left-color: #58a6ff; }
    .job-tab-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .job-tab-actions { display: flex; gap: 0.3rem; opacity: 0; transition: opacity 0.15s; }
    .job-tab:hover .job-tab-actions { opacity: 1; }
    .job-tab-btn {
      background: none; border: none; color: #8b949e; cursor: pointer;
      font-size: 0.8rem; padding: 0.1rem 0.3rem; border-radius: 3px;
    }
    .job-tab-btn:hover { color: #e6edf3; background: #484f58; }
    .job-tab-btn.delete:hover { color: #f85149; }
    .job-color-dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 0.5rem; flex-shrink: 0; }
    .job-tab-info { font-size: 0.65rem; color: #8b949e; margin-left: 0.3rem; white-space: nowrap; }

    /* ===== MAIN ===== */
    #main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    #topbar {
      padding: 0.6rem 1rem;
      background: #fff;
      border-bottom: 1px solid #d0d7de;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
    }
    #topbar h1 { font-size: 1.05rem; flex: 1; min-width: 120px; }

    #provider-section { display: flex; align-items: center; gap: 0.3rem; }
    #provider-section label { font-size: 0.78rem; font-weight: 600; color: #57606a; }
    #provider-select {
      padding: 0.25rem 0.4rem; border: 1px solid #d0d7de; border-radius: 6px;
      font-size: 0.78rem; background: #fff;
    }

    #model-section { display: flex; align-items: center; gap: 0.3rem; }
    #model-section label { font-size: 0.78rem; font-weight: 600; color: #57606a; }
    #model-select {
      padding: 0.25rem 0.4rem; border: 1px solid #d0d7de; border-radius: 6px;
      font-size: 0.78rem; background: #fff; min-width: 220px;
    }
    #model-refresh-btn {
      padding: 0.25rem 0.4rem; background: #f6f8fa; border: 1px solid #d0d7de;
      border-radius: 6px; cursor: pointer; font-size: 0.78rem;
    }
    #model-refresh-btn:hover { background: #e1e4e8; }

    #token-section { display: flex; align-items: center; gap: 0.3rem; }
    #token-section input {
      width: 170px; padding: 0.25rem 0.4rem;
      border: 1px solid #d0d7de; border-radius: 6px; font-size: 0.78rem;
    }
    #token-section button {
      padding: 0.25rem 0.5rem; background: #2da44e; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.75rem;
    }
    #token-section button:hover { background: #218838; }
    #token-status { font-size: 0.75rem; }
    .saved { color: #2da44e; }
    .error-text { color: #cf222e; }

    #context-bar {
      padding: 0.3rem 1rem; background: #fff8c5; border-bottom: 1px solid #d4a72c;
      font-size: 0.78rem; color: #6a5300; display: none;
    }
    #context-bar.visible { display: flex; align-items: center; justify-content: space-between; }

    #content-area { flex: 1; display: flex; overflow: hidden; }

    #chat-panel { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #d0d7de; }
    #chat { flex: 1; overflow-y: auto; padding: 1rem; }
    #input-section {
      padding: 0.75rem 1rem; border-top: 1px solid #d0d7de;
      display: flex; gap: 0.5rem; background: #fff;
    }
    #input-section input {
      flex: 1; padding: 0.6rem 0.8rem;
      border: 1px solid #d0d7de; border-radius: 6px; font-size: 0.95rem;
    }
    #input-section input:focus { outline: 2px solid #0969da; border-color: #0969da; }
    #input-section button {
      padding: 0.6rem 1.2rem; background: #2da44e; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    #input-section button:hover { background: #218838; }
    #input-section button:disabled { background: #94d3a2; cursor: not-allowed; }
    #upload-btn {
      padding: 0.5rem 0.6rem;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    #upload-btn:hover { background: #e1e4e8; }

    #notes-panel { width: 320px; min-width: 280px; display: flex; flex-direction: column; background: #fff; }
    #notes-header {
      padding: 0.6rem 0.75rem; border-bottom: 1px solid #d0d7de;
      font-weight: 700; font-size: 0.85rem; display: flex;
      justify-content: space-between; align-items: center; background: #f6f8fa;
    }
    #notes-header button {
      padding: 0.25rem 0.5rem; background: #0969da; color: #fff;
      border: none; border-radius: 4px; cursor: pointer; font-size: 0.75rem;
    }
    #notes-header button:hover { background: #0550ae; }
    #notes-content { flex: 1; padding: 0.75rem; overflow-y: auto; }
    #notes-editor {
      width: 100%; height: 100%; border: none; resize: none;
      font-family: inherit; font-size: 0.9rem; line-height: 1.6; outline: none;
    }

    /* ===== SUMMARY PAGE ===== */
    #summary-page { flex: 1; overflow-y: auto; padding: 2rem; }

    /* Summary toolbar */
    .summary-toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      padding: 0.6rem 0.8rem;
      background: #fff;
      border: 1px solid #d0d7de;
      border-radius: 8px;
    }
    .summary-toolbar label { font-size: 0.78rem; font-weight: 600; color: #57606a; }
    .summary-toolbar select, .summary-toolbar input[type="number"] {
      padding: 0.25rem 0.4rem; border: 1px solid #d0d7de; border-radius: 4px;
      font-size: 0.78rem; background: #fff;
    }
    .summary-toolbar select#tb-size { min-width: 130px; }
    .summary-toolbar input[type="color"] {
      width: 30px; height: 26px; padding: 0; border: 1px solid #d0d7de;
      border-radius: 4px; cursor: pointer; background: none;
    }
    .toolbar-sep {
      width: 1px; height: 20px; background: #d0d7de; margin: 0 0.2rem;
    }
    .fmt-btn {
      padding: 0.2rem 0.5rem; background: #f6f8fa; border: 1px solid #d0d7de;
      border-radius: 4px; cursor: pointer; font-size: 0.82rem; font-weight: 600;
    }
    .fmt-btn:hover { background: #e1e4e8; }
    .fmt-btn.active { background: #0969da; color: #fff; border-color: #0969da; }

    .summary-hint { font-size: 0.82rem; color: #57606a; margin-bottom: 0.75rem; }

    #summary-editor {
      width: 100%; min-height: 500px; border: 1px solid #d0d7de; border-radius: 8px;
      padding: 1.5rem; font-size: 1rem; line-height: 1.7;
      outline: none; background: #fff; overflow-y: auto;
    }
    #summary-editor:focus { border-color: #0969da; box-shadow: 0 0 0 2px rgba(9,105,218,0.15); }

    /* Messages */
    .message { margin-bottom: 1rem; padding: 0.75rem 1rem; border-radius: 8px; line-height: 1.6; }
    .message-user { background: #ddf4ff; border: 1px solid #a8d8f0; }
    .message-assistant { background: #f6f8fa; border: 1px solid #d0d7de; }
    .message-error { background: #ffebe9; border: 1px solid #f5c6cb; color: #cf222e; }
    .message-label {
      font-weight: 700; font-size: 0.75rem; text-transform: uppercase;
      margin-bottom: 0.4rem; letter-spacing: 0.03em;
      display: flex; justify-content: space-between; align-items: center;
    }
    .message-user .message-label { color: #0969da; }
    .message-assistant .message-label { color: #1a7f37; }
    .message-error .message-label { color: #cf222e; }
    .message-trimmed { opacity: 0.5; border-style: dashed; }
    .trimmed-divider {
      text-align: center; color: #8b949e; font-size: 0.78rem;
      padding: 0.5rem 0; margin: 0.5rem 0; border-top: 1px dashed #d0d7de;
    }

    .msg-copy-btn, .msg-delete-btn {
      background: #e1e4e8; border: 1px solid #d0d7de; border-radius: 4px;
      padding: 0.15rem 0.5rem; font-size: 0.7rem; cursor: pointer;
      color: #57606a; font-weight: 600;
    }
    .msg-copy-btn:hover { background: #d0d7de; color: #1f2328; }
    .msg-delete-btn { background: #ffebe9; border-color: #f5c6cb; color: #cf222e; }
    .msg-delete-btn:hover { background: #f5c6cb; }
    .msg-actions { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .paste-to-notes-btn {
      background: #ddf4ff; border: 1px solid #a8d8f0; border-radius: 4px;
      padding: 0.15rem 0.5rem; font-size: 0.7rem; cursor: pointer;
      color: #0969da; font-weight: 600;
    }
    .paste-to-notes-btn:hover { background: #a8d8f0; }

    .msg-edit-btn {
      background: #e1e4e8; border: 1px solid #d0d7de; border-radius: 4px;
      padding: 0.15rem 0.5rem; font-size: 0.7rem; cursor: pointer;
      color: #57606a; font-weight: 600;
    }
    .msg-edit-btn:hover:not(:disabled) { background: #d0d7de; color: #1f2328; }
    .msg-lock-btn {
      background: #fff8c5; border: 1px solid #d4a72c; border-radius: 4px;
      padding: 0.15rem 0.5rem; font-size: 0.7rem; cursor: pointer;
      color: #6a5300; font-weight: 600;
    }
    .msg-lock-btn:hover { background: #f5e17a; }
    .msg-move-btn {
      background: #f6f8fa; border: 1px solid #d0d7de; border-radius: 4px;
      padding: 0.15rem 0.5rem; font-size: 0.7rem; cursor: pointer;
      color: #57606a; font-weight: 600;
    }
    .msg-move-btn:hover:not(:disabled) { background: #e1e4e8; }
    .msg-move-btn:disabled, .msg-edit-btn:disabled, .msg-delete-btn:disabled {
      opacity: 0.4; cursor: not-allowed;
    }
    .message-locked { border-left: 3px solid #d4a72c !important; }
    .msg-edit-textarea {
      width: 100%; min-height: 150px; resize: vertical;
      border: 2px solid #0969da; border-radius: 6px;
      padding: 0.5rem; font-family: inherit; font-size: 0.95rem;
      line-height: 1.6; box-sizing: border-box; display: block;
    }
    .msg-edit-area { margin-top: 0.5rem; }
    .msg-edit-btns { display: flex; gap: 0.4rem; margin-top: 0.4rem; }
    .msg-save-btn {
      background: #2da44e; color: #fff; border: none; border-radius: 4px;
      padding: 0.25rem 0.75rem; font-size: 0.75rem; cursor: pointer; font-weight: 600;
    }
    .msg-save-btn:hover { background: #218838; }
    .msg-cancel-btn {
      background: #e1e4e8; color: #1f2328; border: 1px solid #d0d7de; border-radius: 4px;
      padding: 0.25rem 0.75rem; font-size: 0.75rem; cursor: pointer; font-weight: 600;
    }
    .msg-cancel-btn:hover { background: #d0d7de; }

    .message-body p { margin: 0.5em 0; }
    .message-body p:first-child { margin-top: 0; }
    .message-body p:last-child { margin-bottom: 0; }
    .message-body ul, .message-body ol { margin: 0.5em 0; padding-left: 1.5em; }
    .message-body li { margin: 0.25em 0; }
    .message-body h1, .message-body h2, .message-body h3 {
      margin: 0.75em 0 0.25em; padding-bottom: 0.2em; border-bottom: 1px solid #d0d7de;
    }
    .message-body h1 { font-size: 1.3em; }
    .message-body h2 { font-size: 1.15em; }
    .message-body h3 { font-size: 1.05em; border: none; }
    .message-body code {
      background: #eff1f3; padding: 0.15em 0.4em; border-radius: 4px;
      font-size: 0.88em; font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }
    .message-body pre {
      background: #161b22; color: #e6edf3; padding: 1rem;
      border-radius: 6px; overflow-x: auto; margin: 0.75em 0;
    }
    .message-body pre code { background: none; padding: 0; color: inherit; font-size: 0.85em; line-height: 1.5; }
    .code-wrapper { position: relative; }
    .copy-btn {
      position: absolute; top: 0.5rem; right: 0.5rem; background: #30363d;
      color: #e6edf3; border: 1px solid #484f58; border-radius: 4px;
      padding: 0.2rem 0.5rem; font-size: 0.75rem; cursor: pointer;
    }
    .copy-btn:hover { background: #484f58; }
    .message-body table { border-collapse: collapse; width: 100%; margin: 0.75em 0; }
    .message-body th, .message-body td { border: 1px solid #d0d7de; padding: 0.4rem 0.75rem; text-align: left; }
    .message-body th { background: #f6f8fa; font-weight: 600; }
    .message-body blockquote { border-left: 3px solid #d0d7de; padding-left: 1rem; color: #57606a; margin: 0.5em 0; }

    .message-document { background: #f0f6ff; border: 1px solid #a8d8f0; border-left: 3px solid #0969da; }
    .document-indicator { font-size: 0.95rem; font-weight: 600; color: #0969da; }
    .document-toggle-btn {
      margin-top: 0.4rem; background: #ddf4ff; border: 1px solid #a8d8f0; border-radius: 4px;
      padding: 0.15rem 0.6rem; font-size: 0.75rem; cursor: pointer; color: #0969da; font-weight: 600; display: block;
    }
    .document-toggle-btn:hover { background: #a8d8f0; }
    .document-content {
      max-height: 300px; overflow-y: auto; background: #f6f8fa; border: 1px solid #d0d7de;
      border-radius: 6px; padding: 0.75rem; font-family: monospace; font-size: 0.82rem;
      white-space: pre-wrap; margin-top: 0.5rem; display: none;
    }
    .document-content.visible { display: block; }

    .message-manual-content { background: #f0fff4; border: 1px solid #a7f3d0; border-left: 3px solid #2da44e; }
    .manual-content-indicator { font-size: 0.95rem; font-weight: 600; color: #2da44e; }
    .manual-content-toggle-btn {
      margin-top: 0.4rem; background: #dcfce7; border: 1px solid #a7f3d0; border-radius: 4px;
      padding: 0.15rem 0.6rem; font-size: 0.75rem; cursor: pointer; color: #2da44e; font-weight: 600; display: block;
    }
    .manual-content-toggle-btn:hover { background: #a7f3d0; }
    .manual-content-display {
      max-height: 300px; overflow-y: auto; border-radius: 6px;
      padding: 0.75rem; font-size: 0.82rem; margin-top: 0.5rem; display: none;
    }
    .manual-content-display.visible { display: block; }
    .manual-content-terminal {
      background: #161b22; color: #e6edf3;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      white-space: pre-wrap; border: 1px solid #30363d;
    }
    .manual-content-text { background: #f6f8fa; border: 1px solid #d0d7de; font-family: inherit; white-space: pre-wrap; }

    .message-image { background: #fff8f0; border: 1px solid #fed8b1; border-left: 3px solid #ffa657; }
    .image-indicator { font-size: 0.95rem; font-weight: 600; color: #e87b00; }
    .image-toggle-btn {
      margin-top: 0.4rem; background: #fff0d9; border: 1px solid #fed8b1; border-radius: 4px;
      padding: 0.15rem 0.6rem; font-size: 0.75rem; cursor: pointer; color: #e87b00; font-weight: 600; display: block;
    }
    .image-toggle-btn:hover { background: #fed8b1; }
    .image-preview {
      max-width: 100%; max-height: 400px; border-radius: 6px; border: 1px solid #d0d7de;
      margin-top: 0.5rem; display: none; cursor: pointer;
    }
    .image-preview.visible { display: block; }

    .input-attach-group { display: flex; gap: 0.3rem; }
    #input-section .input-attach-btn {
      padding: 0.5rem 0.6rem; background: #f6f8fa; border: 1px solid #d0d7de;
      border-radius: 6px; cursor: pointer; font-size: 0.95rem; line-height: 1; color: inherit; font-weight: normal;
    }
    #input-section .input-attach-btn:hover { background: #e1e4e8; }
    #input-section .input-attach-btn:active { background: #d0d7de; }

    .manual-content-modal .modal { width: 520px; }
    .manual-content-modal .modal textarea { height: 200px; }
    .manual-content-modal label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; color: #1f2328; }
    .manual-content-modal input, .manual-content-modal select { width: 100%; padding: 0.5rem; border: 1px solid #d0d7de; border-radius: 6px; font-size: 0.95rem; margin-bottom: 0.75rem; font-family: inherit; box-sizing: border-box; }

    .typing-dot {
      display: inline-block; width: 8px; height: 8px; background: #57606a;
      border-radius: 50%; margin: 0 2px; animation: blink 1.4s infinite both;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }

    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); display: flex;
      align-items: center; justify-content: center; z-index: 100;
    }
    .modal {
      background: #fff; border-radius: 10px; padding: 1.5rem;
      width: 420px; box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .modal h3 { margin-bottom: 0.5rem; }
    .modal p { font-size: 0.85rem; color: #57606a; margin-bottom: 0.75rem; }
    .modal input, .modal textarea {
      width: 100%; padding: 0.5rem; border: 1px solid #d0d7de;
      border-radius: 6px; font-size: 0.95rem; margin-bottom: 1rem; font-family: inherit;
    }
    .modal textarea { height: 80px; resize: vertical; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 0.5rem; }
    .modal-btns button {
      padding: 0.4rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .modal-btns .cancel { background: #e1e4e8; color: #1f2328; }
    .modal-btns .confirm { background: #2da44e; color: #fff; }
    .modal-btns .cancel:hover { background: #d0d7de; }
    .modal-btns .confirm:hover { background: #218838; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="sidebar-header">
      <h2>💬 Chat Jobs</h2>
      <button class="sidebar-btn" id="new-job-btn" onclick="createNewJob()">+ New Job Section</button>
      <div class="sidebar-actions">
        <button class="sidebar-btn" onclick="exportData()">📤 Export</button>
        <button class="sidebar-btn" onclick="importData()">📥 Import</button>
      </div>
      <div class="sidebar-actions">

    marked.setOptions({

    // ===== DB =====
    function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    function loadDB() {
      var raw = localStorage.getItem(DB_KEY);
      if (raw) {
        try {
          db = JSON.parse(raw);
          if (!db.summary) db.summary = "";
          if (!db.activeView) db.activeView = "summary";
          if (!db.summaryTitle) db.summaryTitle = "Document Summary";
          if (!db.summaryStyle) db.summaryStyle = { fontFamily: "sans-serif", fontSize: 16, textColor: "#1f2328", bgColor: "#ffffff" };
          if (db.activeProvider) activeProvider = db.activeProvider;
        } catch(e) {
          db = { jobs:[], activeJobId:null, activeView:"summary", summary:"", summaryTitle:"Document Summary",
            summaryStyle:{ fontFamily:"sans-serif", fontSize:16, textColor:"#1f2328", bgColor:"#ffffff" } };
        }
      }
    }
    function getJob(id) { return db.jobs.find(function(j) { return j.id === id; }); }

    // ===== TOKEN =====
    function saveToken() {
      var input = document.getElementById("tokenInput").value.trim();
      if (!input) { document.getElementById("token-status").innerHTML = '<span class="error-text">Enter token</span>'; return; }
      if (activeProvider === "github") {
        token = input;
        localStorage.setItem(TOKEN_KEY, token);
        fetchModels();
      } else if (activeProvider === "openai") {
        openaiToken = input;
        localStorage.setItem(OPENAI_TOKEN_KEY, openaiToken);
      } else if (activeProvider === "anthropic") {
        anthropicToken = input;
        localStorage.setItem(ANTHROPIC_TOKEN_KEY, anthropicToken);
      }
      document.getElementById("token-status").innerHTML = '<span class="saved">✅ Saved</span>';
    }
    function loadToken() {
      var saved = localStorage.getItem(TOKEN_KEY);
      if (saved) token = saved;
      var savedOpenai = localStorage.getItem(OPENAI_TOKEN_KEY);
      if (savedOpenai) openaiToken = savedOpenai;
      var savedAnthropic = localStorage.getItem(ANTHROPIC_TOKEN_KEY);
      if (savedAnthropic) anthropicToken = savedAnthropic;
      updateProviderUI();
    }

    // ===== PROVIDER =====
    function onProviderChange() {
      activeProvider = document.getElementById("provider-select").value;
      db.activeProvider = activeProvider;
      saveDB();
      updateProviderUI();
    }

    function updateProviderUI() {
      var providerSelect = document.getElementById("provider-select");
      var tokenInput = document.getElementById("tokenInput");
      var tokenStatus = document.getElementById("token-status");
      var refreshBtn = document.getElementById("model-refresh-btn");

      providerSelect.value = activeProvider;

      if (activeProvider === "github") {
        tokenInput.placeholder = "ghp_xxxxxxxxxxxx";
        tokenInput.value = token;
        tokenStatus.innerHTML = token ? '<span class="saved">✅</span>' : '';
        refreshBtn.style.display = "";
        loadCachedModels();
      } else if (activeProvider === "openai") {
        tokenInput.placeholder = "sk-...";
        tokenInput.value = openaiToken;
        tokenStatus.innerHTML = openaiToken ? '<span class="saved">✅</span>' : '';
        refreshBtn.style.display = "none";
        populateModelSelect(OPENAI_MODELS);
      } else if (activeProvider === "anthropic") {
        tokenInput.placeholder = "sk-ant-...";
        tokenInput.value = anthropicToken;
        tokenStatus.innerHTML = anthropicToken ? '<span class="saved">✅</span>' : '';
        refreshBtn.style.display = "none";
        populateModelSelect(ANTHROPIC_MODELS);
      }
    }

    // ===== MODELS =====
    async function fetchModels() {
      if (activeProvider !== "github") return;
      if (!token) { populateModelSelect(FALLBACK_MODELS); return; }
      var btn = document.getElementById("model-refresh-btn");
      btn.textContent = "⏳";
      try {
        var r = await fetch(MODELS_URL, {
          headers: { "Authorization": "Bearer " + token, "Accept": "application/json" }
        });
        if (!r.ok) { populateModelSelect(FALLBACK_MODELS); btn.textContent = "🔄"; return; }
        var data = await r.json();
        var models = [];
        var list = Array.isArray(data) ? data : (data.data || data.models || []);
        list.forEach(function(m) {
          var id = m.id || m.name || "";
          if (!id) return;
          if (m.task && m.task !== "chat-completion") return;
          var label = m.friendly_name || m.display_name || id;
          if (m.publisher) label += " (" + m.publisher + ")";
          models.push({ id: id, name: label });
        });
        if (models.length === 0) models = FALLBACK_MODELS;
        models.sort(function(a, b) { return a.name.localeCompare(b.name); });
        localStorage.setItem(MODELS_CACHE_KEY, JSON.stringify(models));
        populateModelSelect(models);
      } catch(e) { populateModelSelect(FALLBACK_MODELS); }
      btn.textContent = "🔄";
    }

    function populateModelSelect(models) {
      var sel = document.getElementById("model-select");
      sel.innerHTML = "";
      models.forEach(function(m) {
        var o = document.createElement("option");
        o.value = m.id; o.textContent = m.name;
        if (m.id === selectedModel) o.selected = true;
        sel.appendChild(o);
      });
      if (sel.value) selectedModel = sel.value;
      sel.onchange = function() { selectedModel = this.value; };
    }

    function loadCachedModels() {
      var c = localStorage.getItem(MODELS_CACHE_KEY);
      if (c) { try { var m = JSON.parse(c); if (m.length) { populateModelSelect(m); return; } } catch(e) {} }
      populateModelSelect(FALLBACK_MODELS);
    }

    // ===== SLIDING WINDOW =====
    function buildContextMessages(all) {
      var sys = all[0], conv = all.slice(1);
      var fc = KEEP_FIRST * 2, lc = KEEP_LAST * 2;
      var msgs;
      if (conv.length <= fc + lc) { msgs = [sys].concat(conv); }
      else {
        var first = conv.slice(0, fc), last = conv.slice(-lc);
        var skip = conv.length - fc - lc;
        var note = { role: "developer", content: "[Note: " + skip + " messages omitted. First " + KEEP_FIRST + " and last " + KEEP_LAST + " exchanges included.]" };
        msgs = [sys].concat(first).concat([note]).concat(last);
      }
      // Convert image messages to vision multipart format for supported providers
      var isVisionCapable = (activeProvider === "openai" || activeProvider === "github");
      return msgs.map(function(m) {
        if (m.isImage && m.imageData && isVisionCapable) {
          return {
            role: "user",
            content: [
              { type: "text", text: "I've attached a screenshot for analysis." },
              { type: "image_url", image_url: { url: m.imageData } }
            ]
          };
        }
        return { role: m.role, content: m.content };
      });
    }

    // ===== MODAL =====
    function showModal(title, subtitle, val, isTA, cb) {
      var ov = document.createElement("div"); ov.className = "modal-overlay";
      var ih = isTA ? '<textarea id="modal-input">' + escapeHtml(val || '') + '</textarea>'
        : '<input type="text" id="modal-input" value="' + escapeHtml(val || '') + '" />';
      ov.innerHTML = '<div class="modal"><h3>' + title + '</h3>' + (subtitle ? '<p>' + subtitle + '</p>' : '') + ih +
        '<div class="modal-btns"><button class="cancel" id="modal-cancel">Cancel</button>' +
        '<button class="confirm" id="modal-confirm">OK</button></div></div>';
      document.body.appendChild(ov);
      var inp = document.getElementById("modal-input"); inp.focus(); if (!isTA) inp.select();
      document.getElementById("modal-confirm").onclick = function() { var v = inp.value.trim(); document.body.removeChild(ov); cb(v); };
      document.getElementById("modal-cancel").onclick = function() { document.body.removeChild(ov); };
      if (!isTA) inp.addEventListener("keydown", function(e) {
        if (e.key === "Enter") document.getElementById("modal-confirm").click();
        if (e.key === "Escape") document.getElementById("modal-cancel").click();
      });
    }

    // ===== SUMMARY =====
    function showSummary() {
      saveCurrentNotes(); db.activeView = "summary"; db.activeJobId = null; saveDB(); renderSidebar(); renderView();
    }

    function renameSummary() {
      showModal("Rename Summary Page", "", db.summaryTitle, false, function(v) {
        if (!v) return;
        db.summaryTitle = v;

        if (db.activeView === "summary") renderView();

            '<div class="toolbar-sep"></div>' +

            '<label>Size:</label>' +

      var editor = document.getElementById("summary-editor");

      editor.addEventListener("input", function() {
        db.summary = this.innerHTML;

    // ===== SELECTION HELPERS =====
    var _savedRange = null;

    function saveEditorSelection() {
      var sel = window.getSelection();
      if (sel && sel.rangeCount > 0) _savedRange = sel.getRangeAt(0).cloneRange();
    }

    function restoreEditorSelection() {
      var ed = document.getElementById("summary-editor");
      if (!ed) return;
      ed.focus();
      if (!_savedRange) return;
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(_savedRange);
    }

    // ===== PER-SELECTION FORMATTING =====
    function applyFontFamily(value) {
      restoreEditorSelection();
      document.execCommand("fontName", false, value);
      var ed = document.getElementById("summary-editor");
      if (ed) { db.summary = ed.innerHTML; saveDB(); }
    }

    function applyFontSize(value) {
      restoreEditorSelection();
      document.execCommand("fontSize", false, value);
      var ed = document.getElementById("summary-editor");
      if (ed) { db.summary = ed.innerHTML; saveDB(); }
    }

    function applyTextColor(value) {
      restoreEditorSelection();
      document.execCommand("foreColor", false, value);
      var ed = document.getElementById("summary-editor");
      if (ed) { db.summary = ed.innerHTML; saveDB(); }
    }

    function applyBgColor(value) {
      restoreEditorSelection();
      // 'hiliteColor' is the standard; 'backColor' is a Firefox fallback
      if (!document.execCommand("hiliteColor", false, value)) {
        document.execCommand("backColor", false, value);
      }
      var ed = document.getElementById("summary-editor");
      if (ed) { db.summary = ed.innerHTML; saveDB(); }
    }

    // ===== PDF EXPORT =====
    function stripHtmlToText(html) {
      var tmp = document.createElement("div");
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || "";
    }

    function stripMarkdown(text) {
      if (!text) return "";
      return text
        .replace(/```[\w]*\n?([\s\S]*?)```/g, "$1")
        .replace(/`([^`]+)`/g, "$1")
        .replace(/\*\*([^*]+)\*\*/g, "$1")
        .replace(/\*([^*]+)\*/g, "$1")
        .replace(/#{1,6}\s+/g, "")
        .replace(/<a[^>]*href="([^"]*)"[^>]*>([^<]*)<\/a>/gi, "$2 ($1)")
        .replace(/<[^>]+>/g, "");
    }

    async function exportToPDF(btn) {
      if (!window.jspdf) {
        alert("PDF library is still loading. Please try again in a moment.");
        return;
      }
      if (btn) { btn.textContent = "⏳ Generating…"; btn.disabled = true; }
      try {
        saveCurrentNotes();
        var se = document.getElementById("summary-editor");
        if (se) db.summary = se.innerHTML;

        var jsPDF = window.jspdf.jsPDF;
        var pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
        var totalPagesAlias = "{total_pages_count_string}";

        var pageW = pdf.internal.pageSize.getWidth();
        var pageH = pdf.internal.pageSize.getHeight();
        var marginL = 15, marginT = 20, marginB = 20;
        var contentW = pageW - marginL * 2;
        var y = marginT;

        // Line height in mm from font size in pt
        function lh(fs) { return fs * 0.45; }

        function newPage() { pdf.addPage(); y = marginT; }

        function checkBreak(needed) {
          if (y + needed > pageH - marginB) { newPage(); }
        }

        function setStyle(fs, style, r, g, b) {
          pdf.setFontSize(fs);
          pdf.setFont("helvetica", style || "normal");
          if (r !== undefined) { pdf.setTextColor(r, g, b); } else { pdf.setTextColor(0, 0, 0); }
        }

        function writeWrapped(text, fs, style, indent, r, g, b) {
          if (!text) return;
          setStyle(fs, style, r, g, b);
          var x = marginL + (indent || 0);
          var w = contentW - (indent || 0);
          var lines = pdf.splitTextToSize(text, w);
          var lineH = lh(fs);
          for (var i = 0; i < lines.length; i++) {
            checkBreak(lineH);
            pdf.text(lines[i], x, y);
            y += lineH;
          }
          if (r !== undefined) { pdf.setTextColor(0, 0, 0); }
        }

        function hRule(thickness) {
          checkBreak(3);
          pdf.setLineWidth(thickness || 0.3);
          pdf.line(marginL, y, pageW - marginL, y);
          y += 2;
        }

        var docTitle = db.summaryTitle || "Document Summary";
        var totalJobs = db.jobs.length;
        var totalExchanges = db.jobs.reduce(function(acc, j) {
          return acc + Math.floor((j.messages.length - 1) / 2);
        }, 0);
        var sectionPages = {};
        var now = new Date();
        var dateStr = now.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
        var dateFileStr = now.toISOString().slice(0, 10);

        // ===== PAGE 1: COVER =====
        pdf.setFillColor(41, 182, 246);
        pdf.rect(0, 0, pageW, 65, "F");
        pdf.setTextColor(255, 255, 255);
        pdf.setFontSize(24);
        pdf.setFont("helvetica", "bold");
        var titleLines = pdf.splitTextToSize(docTitle, contentW);
        var ty = 28;
        titleLines.forEach(function(line) {
          pdf.text(line, pageW / 2, ty, { align: "center" });
          ty += lh(24);
        });
        pdf.setFontSize(12);
        pdf.setFont("helvetica", "normal");
        pdf.text(dateStr, pageW / 2, ty + 4, { align: "center" });
        pdf.setTextColor(0, 0, 0);
        y = 80;
        pdf.setFontSize(11);
        pdf.setFont("helvetica", "normal");
        pdf.text("Job Sections: " + totalJobs, pageW / 2, y, { align: "center" });
        y += 8;
        pdf.text("Total Exchanges: " + totalExchanges, pageW / 2, y, { align: "center" });

        // ===== PAGE 2: TABLE OF CONTENTS (placeholder) =====
        pdf.addPage();
        var tocPage = pdf.internal.getCurrentPageInfo().pageNumber;
        // Content will be filled in after all sections are rendered

        // ===== PAGE 3+: DOCUMENT SUMMARY =====
        pdf.addPage();
        sectionPages["summary"] = pdf.internal.getCurrentPageInfo().pageNumber;
        y = marginT;
        setStyle(16, "bold");
        pdf.text(docTitle, marginL, y);
        y += lh(16) + 2;
        hRule();
        y += 2;
        var summaryText = stripHtmlToText(db.summary || "").trim();
        if (!summaryText) { summaryText = "No summary content."; }
        writeWrapped(summaryText, 10, "normal");
        y += 5;

        // ===== JOB SECTIONS =====
        db.jobs.forEach(function(job) {
          pdf.addPage();
          sectionPages["job_" + job.id] = pdf.internal.getCurrentPageInfo().pageNumber;
          y = marginT;

          // Job heading
          setStyle(16, "bold");
          var jLines = pdf.splitTextToSize("Job: " + job.name, contentW);
          jLines.forEach(function(line) { pdf.text(line, marginL, y); y += lh(16); });
          y += 2;
          hRule();
          y += 2;

          // System prompt (italic, muted, capped at 5 lines)
          var sysMsg = job.messages[0];
          if (sysMsg && sysMsg.content) {
            setStyle(8, "italic", 100, 100, 100);
            var spLines = pdf.splitTextToSize("System prompt: " + sysMsg.content, contentW);
            var showLines = spLines.slice(0, 5);
            showLines.forEach(function(line) { checkBreak(lh(8)); pdf.text(line, marginL, y); y += lh(8); });
            if (spLines.length > 5) { pdf.text("[...]", marginL, y); y += lh(8); }
            pdf.setTextColor(0, 0, 0);
            y += 3;
          }

          // Exchange / message count line
          var exCount = Math.floor((job.messages.length - 1) / 2);
          var msgCount = job.messages.length - 1;
          setStyle(8, "normal", 120, 120, 120);
          pdf.text(
            exCount + " exchange" + (exCount !== 1 ? "s" : "") +
            " \u00b7 " + msgCount + " message" + (msgCount !== 1 ? "s" : ""),
            marginL, y
          );
          pdf.setTextColor(0, 0, 0);
          y += lh(8) + 5;

          // Chat messages
          job.messages.slice(1).forEach(function(msg) {
            if (msg.role === "user") {
              checkBreak(lh(10) * 3);
              setStyle(10, "bold");
              pdf.text("YOU:", marginL, y);
              y += lh(10);
              var txt;
              if (msg.isDocument) {
                txt = "[Document]: " + (msg.documentName || "attachment");
              } else if (msg.isImage) {
                txt = "[Image]: " + (msg.imageName || "image");
              } else if (msg.isManualContent) {
                txt = "[Content]: " + (msg.contentTitle || "content") + " (" + (msg.contentType || "text") + ")";
              } else {
                txt = msg.content || "";
              }
              writeWrapped(txt, 10, "normal", 5);
              y += 4;
            } else if (msg.role === "assistant") {
              checkBreak(lh(10) * 3);
              setStyle(10, "bold");
              pdf.text("ASSISTANT:", marginL, y);
              y += lh(10);
              writeWrapped(stripMarkdown(msg.content || ""), 10, "normal", 5);
              y += 4;
            }
          });

          // Notes sub-section
          if (job.notes && job.notes.trim()) {
            checkBreak(20);
            sectionPages["notes_" + job.id] = pdf.internal.getCurrentPageInfo().pageNumber;
            y += 5;
            setStyle(13, "bold");
            var nhLines = pdf.splitTextToSize("Notes for " + job.name, contentW);
            nhLines.forEach(function(line) { pdf.text(line, marginL, y); y += lh(13); });
            y += 1;
            hRule(0.2);
            y += 2;
            writeWrapped(job.notes.trim(), 10, "normal");
            y += 5;
          }
        });

        // ===== PAGE HEADERS & FOOTERS =====
        var totalPages = pdf.internal.getNumberOfPages();
        for (var p = 1; p <= totalPages; p++) {
          pdf.setPage(p);
          pdf.setFontSize(8);
          pdf.setFont("helvetica", "normal");
          pdf.setTextColor(120, 120, 120);
          pdf.text("Page " + p + " of " + totalPagesAlias, pageW / 2, pageH - 8, { align: "center" });
          if (p > 1) {
            pdf.text(docTitle, marginL, 10);
            pdf.setLineWidth(0.2);
            pdf.line(marginL, 12, pageW - marginL, 12);
          }
          pdf.setTextColor(0, 0, 0);
        }

        // ===== FILL IN TABLE OF CONTENTS =====
        pdf.setPage(tocPage);
        y = marginT;
        setStyle(16, "bold");
        pdf.text("Table of Contents", marginL, y);
        y += lh(16) + 2;
        pdf.setLineWidth(0.3);
        pdf.line(marginL, y, pageW - marginL, y);
        y += 6;

        function tocEntry(label, pgNum, indent) {
          indent = indent || 0;
          pdf.setFontSize(10);
          pdf.setFont("helvetica", "normal");
          var pgStr = pgNum !== undefined ? ("" + pgNum) : "?";
          var xL = marginL + indent;
          var xR = pageW - marginL;
          var availW = contentW - indent;
          var labelW = pdf.getTextWidth(label + "  ");
          var pgW = pdf.getTextWidth("  " + pgStr);
          var dotsAvail = availW - labelW - pgW;
          var dotW = pdf.getTextWidth(".");
          var numDots = Math.max(3, Math.floor(dotsAvail / dotW));
          var dots = ".".repeat(numDots);
          pdf.text(label, xL, y);
          pdf.text(dots, xL + labelW, y);
          pdf.text(pgStr, xR, y, { align: "right" });
          y += lh(10) + 2;
        }

        tocEntry("Document Summary", sectionPages["summary"]);
        y += 2;
        db.jobs.forEach(function(job) {
          tocEntry("Job: " + job.name, sectionPages["job_" + job.id]);
          if (job.notes && job.notes.trim() && sectionPages["notes_" + job.id]) {
            tocEntry("Notes: " + job.name, sectionPages["notes_" + job.id], 5);
          }
        });

        // Resolve total pages placeholder and save
        pdf.putTotalPages(totalPagesAlias);
        var filename = (db.summaryTitle || "document-summary").replace(/[^a-z0-9_\-]/gi, "_") + "_" + dateFileStr + ".pdf";
        pdf.save(filename);
      } catch (err) {
        alert("PDF export failed: " + err.message);
      }
      if (btn) { btn.textContent = "📄 PDF"; btn.disabled = false; }
    }

    function formatText(type) {
      var ed = document.getElementById("summary-editor");
      if (!ed) return;
      ed.focus();

      switch (type) {
        case "bold": document.execCommand("bold"); break;
        case "italic": document.execCommand("italic"); break;
        case "underline": document.execCommand("underline"); break;
        case "strikethrough": document.execCommand("strikethrough"); break;
        case "heading":
          var sel = window.getSelection();
          if (sel.rangeCount) {
            var text = sel.toString();
            document.execCommand("insertHTML", false, "<h3>" + escapeHtml(text || "Heading") + "</h3>");
          }
          break;
        case "bullet": document.execCommand("insertUnorderedList"); break;
        case "numbered": document.execCommand("insertOrderedList"); break;
        case "hr": document.execCommand("insertHTML", false, "<hr>"); break;
      }

      db.summary = ed.innerHTML;
      saveDB();
    }

    function updateWordCount() {
      var ed = document.getElementById("summary-editor");
      var wc = document.getElementById("summary-word-count");
      if (!ed || !wc) return;
      var text = ed.innerText || "";
      var words = text.trim().split(/\s+/).filter(function(w) { return w.length > 0; });
      wc.textContent = words.length + " words · " + text.length + " characters";
    }

    // ===== JOBS =====
    function createNewJob() {
      showModal("New Job Section", "Give this job a name", "", false, function(name) {
        if (!name) return;
        showModal("System Prompt", "Sets the AI's role. Sent with every message.", "You are a helpful assistant.", true, function(sp) {
          var job = {
            id: Date.now().toString(), name: name, color: TAB_COLORS[db.jobs.length % TAB_COLORS.length],
            messages: [{ role: "system", content: sp || "You are a helpful assistant." }], notes: ""
          };
          db.jobs.push(job); db.activeJobId = job.id; db.activeView = "job"; saveDB(); renderSidebar(); renderView();
        });
      });
    }
    function switchJob(id) { saveCurrentNotes(); db.activeJobId = id; db.activeView = "job"; saveDB(); renderSidebar(); renderView(); }
    function renameJob(id) {
      var j = getJob(id); if (!j) return;
      showModal("Rename Job", "", j.name, false, function(n) { if (!n) return; j.name = n; saveDB(); renderSidebar(); renderView(); });
    }
    function deleteJob(id) {
      if (!confirm("Delete this job section?")) return;
      db.jobs = db.jobs.filter(function(j) { return j.id !== id; });
      if (db.activeJobId === id) { db.activeJobId = db.jobs.length ? db.jobs[0].id : null; if (!db.activeJobId) db.activeView = "summary"; }
      saveDB(); renderSidebar(); renderView();
    }
    function editSystemPrompt() {
      if (!db.activeJobId) return; var j = getJob(db.activeJobId); if (!j) return;
      showModal("Edit System Prompt", "Sent with every message.", j.messages[0].content, true, function(v) {
        j.messages[0].content = v || "You are a helpful assistant."; saveDB(); updateContextBar();
      });
    }

    function deleteExchange(jobId, msgIndex) {
      var job = getJob(jobId);
      if (!job) return;

      // msgIndex is the index in conversation (0-based, excluding system)
      // actual index in job.messages = msgIndex + 1
      var actualIndex = msgIndex + 1;
      var msg = job.messages[actualIndex];
      if (!msg) return;

      if (msg.role === "assistant") {
        // Delete the assistant reply AND the user question before it
        var prevIndex = actualIndex - 1;
        if (prevIndex >= 1 && job.messages[prevIndex].role === "user") {
          if (!confirm("Delete this exchange (your question + the assistant reply)?")) return;
          job.messages.splice(prevIndex, 2); // remove both
        } else {
          if (!confirm("Delete this assistant reply?")) return;
          job.messages.splice(actualIndex, 1);
        }
      } else {
        if (!confirm("Delete this message?")) return;
        job.messages.splice(actualIndex, 1);
      }

      saveDB();
      renderView();
    }

    function saveCurrentNotes() {
      if (!db.activeJobId) return;
      var ed = document.getElementById("notes-editor");
      if (ed) { var j = getJob(db.activeJobId); if (j) { j.notes = ed.value; saveDB(); } }
    }

    // ===== CONTEXT BAR =====
    function updateContextBar() {
      var bar = document.getElementById("context-bar"), txt = document.getElementById("context-bar-text");
      if (!db.activeJobId || db.activeView !== "job") { bar.classList.remove("visible"); return; }
      var j = getJob(db.activeJobId); if (!j) { bar.classList.remove("visible"); return; }
      var te = Math.floor((j.messages.length - 1) / 2), conv = j.messages.slice(1);
      var docCount = j.messages.filter(function(m) { return m.isDocument; }).length;
      var trimmed = conv.length > (KEEP_FIRST + KEEP_LAST) * 2;
      var sp = j.messages[0].content.substring(0, 80); if (j.messages[0].content.length > 80) sp += "…";
      var info = '🧠 "' + sp + '" | 💬 ' + te + ' exchanges';
      if (docCount > 0) info += ' | 📎 ' + docCount + ' document' + (docCount !== 1 ? 's' : '') + ' attached';
      if (trimmed) { var sk = Math.floor((conv.length - (KEEP_FIRST + KEEP_LAST) * 2) / 2); info += ' | ✂️ First ' + KEEP_FIRST + ' + Last ' + KEEP_LAST + ' (' + sk + ' skipped)'; }
      else info += ' | ✅ Full history sent';
      txt.textContent = info; bar.classList.add("visible");
    }

    // ===== RENDER =====
    function renderView() { if (db.activeView === "summary" || !db.activeJobId) renderSummaryPage(); else renderActiveJob(); }

    function renderSidebar() {
      document.getElementById("summary-tab").className = (db.activeView === "summary" || !db.activeJobId) ? "active" : "";
      document.getElementById("summary-tab-name").textContent = db.summaryTitle;
      var list = document.getElementById("job-list"); list.innerHTML = "";
      db.jobs.forEach(function(job) {
        var mc = Math.floor((job.messages.length - 1) / 2);
        var tab = document.createElement("div");
        tab.className = "job-tab" + (job.id === db.activeJobId && db.activeView === "job" ? " active" : "");
        tab.innerHTML =
          '<span class="job-color-dot" style="background:' + job.color + '"></span>' +
          '<span class="job-tab-name">' + escapeHtml(job.name) + '</span>' +
          '<span class="job-tab-info">' + mc + '</span>' +
          '<span class="job-tab-actions">' +
            '<button class="job-tab-btn" title="Rename" data-action="rename" data-id="' + job.id + '">✏️</button>' +
            '<button class="job-tab-btn delete" title="Delete" data-action="delete" data-id="' + job.id + '">🗑️</button></span>';
        tab.addEventListener("click", function(e) {
          if (e.target.dataset.action === "rename") { renameJob(e.target.dataset.id); return; }
          if (e.target.dataset.action === "delete") { deleteJob(e.target.dataset.id); return; }
